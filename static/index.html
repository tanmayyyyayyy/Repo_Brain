<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepoBrain // Mission Control</title>
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS: FLIGHT RECORDER / MISSION CONTROL
   ───────────────────────────────────────────────────────────── */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  
  /* Dark Mode Default (Precision telemetry) */
  --bg-app: #080c12;
  --bg-rail: #0e131b;
  --bg-surface: #131924;
  --bg-surface-raised: #192231;
  --bg-surface-hover: #212c3e;
  --bg-input: #0b0f16;
  --bg-overlay: rgba(8, 12, 18, 0.85);
  
  --border-subtle: #192231;
  --border-default: #253347;
  --border-strong: #384c67;
  
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-inverse: #080c12;
  
  --brand-accent: #38bdf8;
  --brand-accent-hover: #0284c7;
  --brand-accent-glow: rgba(56, 189, 248, 0.15);
  
  --signal-pass: #10b981;
  --signal-pass-border: #059669;
  --signal-pass-bg: rgba(16, 185, 129, 0.12);
  
  --signal-warn: #f59e0b;
  --signal-warn-border: #d97706;
  --signal-warn-bg: rgba(245, 158, 11, 0.12);
  
  --signal-block: #ef4444;
  --signal-block-border: #dc2626;
  --signal-block-bg: rgba(239, 68, 68, 0.12);
  
  --signal-ai: #8b5cf6;
  --signal-ai-border: #7c3aed;
  --signal-ai-bg: rgba(139, 92, 246, 0.15);

  --syn-keyword: #f472b6;
  --syn-string: #34d399;
  --syn-comment: #64748b;
  --syn-number: #38bdf8;
  
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5);
  --focus-ring: 0 0 0 2px var(--bg-app), 0 0 0 4px var(--brand-accent);
}

[data-theme="light"] {
  --bg-app: #f4f6f9;
  --bg-rail: #e9eff5;
  --bg-surface: #ffffff;
  --bg-surface-raised: #f8fafc;
  --bg-surface-hover: #edf2f7;
  --bg-input: #ffffff;
  --bg-overlay: rgba(244, 246, 249, 0.85);
  
  --border-subtle: #e2e8f0;
  --border-default: #cbd5e1;
  --border-strong: #94a3b8;
  
  --text-primary: #0f172a;
  --text-secondary: #334155;
  --text-muted: #64748b;
  --text-inverse: #ffffff;
  
  --brand-accent: #0284c7;
  --brand-accent-hover: #0369a1;
  --brand-accent-glow: rgba(2, 132, 199, 0.12);
  
  --signal-pass: #059669;
  --signal-pass-border: #047857;
  --signal-pass-bg: rgba(5, 150, 105, 0.1);
  
  --signal-warn: #d97706;
  --signal-warn-border: #b45309;
  --signal-warn-bg: rgba(217, 119, 6, 0.1);
  
  --signal-block: #dc2626;
  --signal-block-border: #b91c1c;
  --signal-block-bg: rgba(220, 38, 38, 0.1);
  
  --signal-ai: #6d28d9;
  --signal-ai-border: #5b21b6;
  --signal-ai-bg: rgba(109, 40, 217, 0.1);

  --syn-keyword: #db2777;
  --syn-string: #059669;
  --syn-comment: #94a3b8;
  --syn-number: #0284c7;
  
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-primary);
  font: 13.5px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ─────────────────────────────────────────────────────────────
   LAYOUT: TELEMETRY TOP BAR & ASYMMETRIC PERSISTENT RAIL
   ───────────────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-default);
  z-index: 40;
  gap: 16px;
  flex-shrink: 0;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  text-decoration: none;
}
.logo-icon {
  width: 22px;
  height: 22px;
  color: var(--brand-accent);
}
.live-pill {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--signal-pass-bg);
  color: var(--signal-pass);
  border: 1px solid var(--signal-pass-border);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.meta-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-surface-raised);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}

.scenarios-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-app);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border-default);
}
.scen-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0 6px;
}
.scen-btn {
  background: transparent;
  color: var(--text-secondary);
  border: 0;
  border-radius: 5px;
  padding: 5px 11px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.scen-btn:hover {
  color: var(--text-primary);
  background: var(--bg-surface-hover);
}
.scen-btn.active {
  color: var(--brand-accent);
  background: var(--bg-surface);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-default);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-chip-btn {
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.action-chip-btn:hover {
  color: var(--text-primary);
  border-color: var(--brand-accent);
  background: var(--bg-surface-hover);
}
.action-chip-btn kbd {
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-family: var(--font-mono);
}
.icon-btn {
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}
.icon-btn:hover {
  color: var(--text-primary);
  border-color: var(--brand-accent);
  background: var(--bg-surface-hover);
}
.icon-btn svg { width: 16px; height: 16px; }

/* Mobile Menu Toggle */
.mobile-menu-btn {
  display: none;
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.mobile-menu-btn svg { width: 18px; height: 18px; }

/* App Main Frame */
.app-frame {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 52px);
  position: relative;
}

/* Left Rail: Flight Pipeline Stepper & Tools */
.telemetry-rail {
  width: 290px;
  background: var(--bg-rail);
  border-right: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  user-select: none;
  transition: transform 0.2s ease;
}
.rail-header {
  padding: 16px 18px 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pipeline-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 10px;
}
.pipeline-node {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  text-align: left;
  background: transparent;
  width: 100%;
}
.pipeline-node:hover {
  background: var(--bg-surface-hover);
}
.pipeline-node.active {
  background: var(--bg-surface);
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}
.node-status-icon {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.node-status-icon svg { width: 12px; height: 12px; }
.status-pass { background: var(--signal-pass-bg); color: var(--signal-pass); border: 1px solid var(--signal-pass-border); }
.status-warn { background: var(--signal-warn-bg); color: var(--signal-warn); border: 1px solid var(--signal-warn-border); }
.status-block { background: var(--signal-block-bg); color: var(--signal-block); border: 1px solid var(--signal-block-border); }
.status-pending { background: var(--bg-surface-raised); color: var(--text-muted); border: 1px solid var(--border-default); }

.node-info { flex: 1; min-width: 0; }
.node-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.node-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.node-desc { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-divider { height: 1px; background: var(--border-subtle); margin: 14px 14px; }

/* Secondary Rail Tools */
.rail-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  border: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  width: 100%;
  text-align: left;
}
.rail-nav-btn:hover { color: var(--text-primary); background: var(--bg-surface-hover); }
.rail-nav-btn.active { color: var(--brand-accent); background: var(--bg-surface); border: 1px solid var(--border-default); }
.rail-nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Main Canvas */
.main-canvas {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  background: var(--bg-app);
  padding: 24px;
  gap: 20px;
}

/* ─────────────────────────────────────────────────────────────
   VERDICT HERO COMPONENT (DOMINANT MERGE GATE STATE)
   ───────────────────────────────────────────────────────────── */
.verdict {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: relative;
  overflow: hidden;
}
.verdict::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 6px;
}
.v-ALLOWED::before { background: var(--signal-pass); }
.v-ALLOWED { border-color: var(--signal-pass-border); }
.v-BLOCKED::before { background: var(--signal-block); }
.v-BLOCKED { border-color: var(--signal-block-border); }
.v-CHANGES_REQUIRED::before { background: var(--signal-warn); }
.v-CHANGES_REQUIRED { border-color: var(--signal-warn-border); }

.verdict-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.verdict-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}
.verdict-icon-box {
  width: 44px;
  height: 44px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.verdict-icon-box svg { width: 24px; height: 24px; }
.v-ALLOWED .verdict-icon-box { background: var(--signal-pass-bg); color: var(--signal-pass); border: 1px solid var(--signal-pass-border); }
.v-BLOCKED .verdict-icon-box { background: var(--signal-block-bg); color: var(--signal-block); border: 1px solid var(--signal-block-border); }
.v-CHANGES_REQUIRED .verdict-icon-box { background: var(--signal-warn-bg); color: var(--signal-warn); border: 1px solid var(--signal-warn-border); }

.verdict-badge .big {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.v-ALLOWED .big { color: var(--signal-pass); }
.v-BLOCKED .big { color: var(--signal-block); }
.v-CHANGES_REQUIRED .big { color: var(--signal-warn); }

.verdict-summary {
  flex: 1;
  min-width: 260px;
}
.verdict-reason {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.verdict-meta {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.verdict-action-slot {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* Gate Checklist */
.gate-checklist {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
}
.gate-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-surface-raised);
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
}
.gate-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}
.gate-icon svg { width: 14px; height: 14px; }
.gate-pass .gate-icon { color: var(--signal-pass); }
.gate-fail .gate-icon { color: var(--signal-block); }
.gate-warn .gate-icon { color: var(--signal-warn); }
.gate-pending .gate-icon { color: var(--text-muted); }
.gate-label { font-size: 12px; font-weight: 700; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.04em; }
.gate-detail { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; margin-top: 2px; }

/* Telemetry Cards */
.telemetry-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.telemetry-card h3 {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 0 0 14px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Complexity Visualization Bars */
.comp-bar-container {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 130px;
}
.comp-bar-track {
  height: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 99px;
  position: relative;
  overflow: visible;
}
.comp-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.3s ease;
}
.comp-bar-fill.bar-ok { background: var(--signal-pass); }
.comp-bar-fill.bar-warn { background: var(--signal-warn); }
.comp-bar-fill.bar-block { background: var(--signal-block); }
.comp-threshold-line {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: var(--text-primary);
  border-radius: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
  z-index: 2;
}
.comp-bar-label {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}

/* PR Map Row Hover & Risk */
.pr-file-row {
  cursor: pointer;
  transition: background 0.15s ease;
}
.pr-file-row:hover td {
  background: var(--bg-surface-hover) !important;
}
.file-risk-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}

/* Buttons */
button.b {
  background: var(--brand-accent);
  color: var(--text-inverse);
  border: 0;
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}
button.b:hover { background: var(--brand-accent-hover); }
button.b.s {
  background: var(--bg-surface-raised);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
}
button.b.s:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
}
button.b.d { background: var(--signal-block); color: #fff; }
button.b.g { background: var(--signal-pass); color: #fff; }
button.b:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

/* Form Controls */
input, textarea, select {
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 13px;
  width: 100%;
}
input:focus, textarea:focus {
  outline: none;
  border-color: var(--brand-accent);
  box-shadow: var(--focus-ring);
}
textarea { font-family: var(--font-mono); font-size: 12px; min-height: 110px; }
label { font-size: 11.5px; font-weight: 600; color: var(--text-muted); display: block; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 150px; }
.row > button { flex: none; }

/* Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid var(--border-default);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.p-block { color: var(--signal-block); border-color: var(--signal-block-border); background: var(--signal-block-bg); }
.p-warn { color: var(--signal-warn); border-color: var(--signal-warn-border); background: var(--signal-warn-bg); }
.p-ok { color: var(--signal-pass); border-color: var(--signal-pass-border); background: var(--signal-pass-bg); }
.p-ai { color: var(--signal-ai); border-color: var(--signal-ai-border); background: var(--signal-ai-bg); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
th { color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
tr:hover td { background: var(--bg-surface-raised); }

code, pre { font-family: var(--font-mono); font-size: 12px; }
pre {
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  padding: 12px;
  overflow: auto;
  max-height: 380px;
  margin: 6px 0;
  color: var(--text-secondary);
}

.diff .a { color: var(--signal-pass); background: var(--signal-pass-bg); }
.diff .r { color: var(--signal-block); background: var(--signal-block-bg); }
.diff .h { color: var(--brand-accent); }
.arrow { color: var(--text-muted); }
.good { color: var(--signal-pass); font-weight: 600; }
.mut { color: var(--text-muted); }
.small { font-size: 12px; }
.err { color: var(--signal-block); }
.busy { opacity: 0.6; pointer-events: none; }

/* Toast Notifications */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--bg-surface-raised);

  padding-left: 12px;
  margin-top: 10px;
}
.audit-node {
  display: flex;
  gap: 18px;
  position: relative;
  padding-bottom: 24px;
}
.audit-node:last-child {
  padding-bottom: 8px;
}
.chain-line-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  width: 24px;
  position: relative;
}
.chain-node-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg-surface-raised);
  border: 2px solid var(--brand-accent);
  z-index: 2;
  transition: all 0.25s ease;
}
.audit-node.tampered .chain-node-dot {
  border-color: var(--signal-block);
  background: var(--signal-block);
  box-shadow: 0 0 8px var(--signal-block);
}
.audit-node.sweep-active .chain-node-dot {
  border-color: var(--signal-pass);
  background: var(--signal-pass);
  box-shadow: 0 0 10px var(--signal-pass);
}
.chain-connector {
  position: absolute;
  top: 14px;
  bottom: -4px;
  width: 2px;
  background: var(--border-default);
  z-index: 1;
}
.audit-node:last-child .chain-connector {
  display: none;
}
.audit-node.tampered .chain-connector,
.audit-node.downstream-broken .chain-connector {
  background: var(--signal-block);
  border-left: 2px dashed var(--signal-block);
  width: 0;
}
.audit-node-body {
  flex: 1;
  background: var(--bg-surface-raised);

  border-radius: 8px;
  padding: 12px 16px;

}
.audit-node.tampered .audit-node-body {
  border-color: var(--signal-block);

}
.audit-node.downstream-broken .audit-node-body {
  border-color: var(--signal-block-border);

}
.audit-node-header {

}
.audit-seq {

.audit-hash-link {

<script>
/* ─────────────────────────────────────────────────────────────
   GLOBAL STATE & UTILITIES
   ───────────────────────────────────────────────────────────── */
const S = {
  tab: "review",
  token: new URLSearchParams(location.search).get("t") || "",
  state: null,
  rev: null,
  prop: null,
  audit: null,
  shield: null,
  expl: null,
  tamper: null,
  busy: false,
  diffModal: null,
  tourActive: false,
  tourIndex: 0
};

const $ = s => document.querySelector(s);
function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function toast(msg, isErr = false) {
  const c = $("#toast-container");
  const el = document.createElement("div");
  el.className = `toast ${isErr ? "toast-err" : ""}`;
  el.innerHTML = `<span>${isErr ? "⛔" : "✓"}</span><div style="flex:1">${esc(msg)}</div><button style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:14px" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
}

async function api(path, body) {
  const opts = { headers: {} };
  if (S.token) opts.headers["X-RepoBrain-Token"] = S.token;
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); msg = j.error || msg; } catch(_) {}
    throw new Error(msg);
  }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("application/json") ? r.json() : r.text();
}

async function guard(fn) {
  S.busy = true;
  render();
  try { await fn(); }
  catch (e) { toast(e.message, true); }
  finally { S.busy = false; render(); }
}

function sev(s) {
  return `<span class="pill ${s === "block" ? "p-block" : "p-warn"}">${esc(s.toUpperCase())}</span>`;
}
function pill(t, c) {
  return `<span class="pill ${c || ""}">${esc(t)}</span>`;
}

/* ─────────────────────────────────────────────────────────────
   THEME SWITCHER
   ───────────────────────────────────────────────────────────── */
function initTheme() {
  const saved = localStorage.getItem("repobrain-theme");
  const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeIcon(theme);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nxt);
  localStorage.setItem("repobrain-theme", nxt);
  updateThemeIcon(nxt);
  toast(`Switched to ${nxt} telemetry mode`);
}

function updateThemeIcon(t) {
  const icon = $("#themeIcon");
  if (!icon) return;
  if (t === "light") {
    icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
  } else {
    icon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
  }
}

   NAVIGATION & PIPELINE TELEMETRY
   ───────────────────────────────────────────────────────────── */
const TABS = [
  ["review", "PR review"],
  ["optimizer", "Optimizer"],
  ["shield", "Shield"],
  ["explainer", "Failure explainer"],
  ["audit", "Audit & report"],
  ["policy", "Policy"]
];

function nav() {
  document.querySelectorAll(".rail-nav-btn").forEach(btn => btn.classList.remove("active"));
  const btnMap = {
    review: $("#btnTabReview"),
    optimizer: $("#btnTabOptimizer"),
    shield: $("#btnTabShield"),
    explainer: $("#btnTabExplainer"),
    audit: $("#btnTabAudit"),
    policy: $("#btnTabPolicy")
  };
  if (btnMap[S.tab]) btnMap[S.tab].classList.add("active");
  
  // Hidden nav for backwards compatibility
  const hnav = $("#nav");
  if (hnav) {
    hnav.innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join("");
  }
}

function go(tab) {
  S.tab = tab;
  nav();
  render();
  if (window.innerWidth <= 900) {
    $("#telemetryRail").classList.remove("open");
  }
}

async function loadState() {
  S.state = await api("/api/state");
  const r = (S.state && S.state.repo) || {};
  $("#meta").innerHTML = `<span>${esc(r.branch || "")}</span><span style="color:var(--border-strong)">@</span><span>${esc(String(r.head || "").slice(0, 8))}</span><span style="color:var(--text-muted)">vs</span><span>${esc(r.base || "")}</span>`;
  
  const scenLabels = { "risky": "A · risky AI PR", "pricing": "B · messy AI PR", "orders": "C · AI refactor" };
  const currentScen = (r.branch || "").includes("risky") ? "risky" : (r.branch || "").includes("pricing") ? "pricing" : (r.branch || "").includes("orders") ? "orders" : "";
  
  $("#scen").innerHTML = r.demo ? `
    <span class="scen-label">Scenario:</span>
    ${(r.scenarios || []).map(n => `<button class="scen-btn ${n === currentScen ? "active" : ""}" onclick="scenario('${n}')">${scenLabels[n] || n}</button>`).join("")}
    <button class="scen-btn" onclick="resetDemo()">Reset</button>
  ` : "";
}

function scenario(n) {
  guard(async () => {
    await api("/api/scenario", { name: n });
    S.prop = null;
    S.tab = "review";
    nav();
    await loadState();
    S.rev = await api("/api/review", {});
    toast(`Switched repository scenario to '${n}'`);
  });
}

function resetDemo() {
  if (!confirm("Reseed the demo repository and reset audit log?")) return;
  guard(async () => {
    await api("/api/reset", {});
    S.prop = null;
    S.tab = "review";
    nav();
    await loadState();
    S.rev = await api("/api/review", {});
    await audit();
    toast("Demo repository reset to pristine initial state");
  });
}

async function audit() {
  try {
    S.audit = await api("/api/audit");
    const a = S.audit;
    const chainEl = $("#chainStatus");
    if (chainEl && a && a.chain) {
      chainEl.className = a.chain.ok ? "pill p-ok" : "pill p-block";
      chainEl.textContent = a.chain.ok ? "chain ✓ " + a.chain.count : "chain BROKEN";
    }
  } catch (_) {}
}

function updatePipelineTelemetry() {
  if (!S.rev) return;
  const r = S.rev, c = r.counts;

  // 1. Shield
  const sIcon = $("#pipeShieldIcon");
  const sBadge = $("#pipeShieldBadge");
  const sDesc = $("#pipeShieldDesc");
  if (c.blocks > 0) {
    sIcon.className = "node-status-icon status-block";
    sBadge.className = "pill p-block";
    sBadge.textContent = `${c.blocks} block`;
    sDesc.textContent = `${c.blocks} blocking violation(s)`;
  } else if (c.warnings > 0) {
    sIcon.className = "node-status-icon status-warn";
    sBadge.className = "pill p-warn";
    sBadge.textContent = `${c.warnings} warn`;
    sDesc.textContent = "Warnings detected";
  } else {
    sIcon.className = "node-status-icon status-pass";
    sBadge.className = "pill p-ok";
    sBadge.textContent = "pass";
    sDesc.textContent = "Policy & secrets clean";
  }

  // 2. Complexity Gate
  const gIcon = $("#pipeGateIcon");
  const gBadge = $("#pipeGateBadge");
  const gDesc = $("#pipeGateDesc");
  if (c.gate > 0) {
    gIcon.className = "node-status-icon status-warn";
    gBadge.className = "pill p-warn";
    gBadge.textContent = `${c.gate} fail`;
    gDesc.textContent = `${c.gate} function(s) over threshold`;
  } else {
    gIcon.className = "node-status-icon status-pass";
    gBadge.className = "pill p-ok";
    gBadge.textContent = "pass";
    gDesc.textContent = "All touched functions within limit";
  }

  // 3. Optimizer
  const oIcon = $("#pipeOptIcon");
  const oBadge = $("#pipeOptBadge");
  const oDesc = $("#pipeOptDesc");
  if (S.prop && S.prop.status === "verified") {
    oIcon.className = "node-status-icon status-pass";
    oBadge.className = "pill p-ok";
    oBadge.textContent = "verified";
    oDesc.textContent = "Tests verified on copy";
  } else if (S.prop && S.prop.status.includes("partial")) {
    oIcon.className = "node-status-icon status-warn";
    oBadge.className = "pill p-warn";
    oBadge.textContent = "partial";
    oDesc.textContent = "Uncovered functions flagged";
  } else {
    oIcon.className = "node-status-icon status-pending";
    oBadge.className = "pill";
    oBadge.textContent = "ready";
    oDesc.textContent = "AST rewrite & test sandbox";
  }

  // 4. Human Approval
  const aIcon = $("#pipeApproveIcon");
  const aBadge = $("#pipeApproveBadge");
  const aDesc = $("#pipeApproveDesc");
  if (S.prop && S.prop.applied) {
    aIcon.className = "node-status-icon status-pass";
    aBadge.className = "pill p-ok";
    aBadge.textContent = "approved";
    aDesc.textContent = `Applied as commit ${S.prop.applied.commit ? String(S.prop.applied.commit).slice(0, 7) : "commit"}`;
  } else {
    aIcon.className = "node-status-icon status-pending";
    aBadge.className = "pill";
    aBadge.textContent = "required";
    aDesc.textContent = "Named approver trailer";
  }

  // 5. Merge Gate Verdict
  const mIcon = $("#pipeMergeIcon");
  const mBadge = $("#pipeMergeBadge");
  const mDesc = $("#pipeMergeDesc");
  if (r.decision === "ALLOWED") {
    mIcon.className = "node-status-icon status-pass";
    mBadge.className = "pill p-ok";
    mBadge.textContent = "ALLOWED";
    mDesc.textContent = "All gates passed. Ready to merge";
  } else if (r.decision === "BLOCKED") {
    mIcon.className = "node-status-icon status-block";
    mBadge.className = "pill p-block";
    mBadge.textContent = "BLOCKED";
    mDesc.textContent = "Blocked by policy. Not waivable";
  } else {
    mIcon.className = "node-status-icon status-warn";
    mBadge.className = "pill p-warn";
    mBadge.textContent = "CHANGES REQUIRED";
    mDesc.textContent = "Requires optimizer or human waiver";
  }
}

/* ─────────────────────────────────────────────────────────────
   COMPLEXITY BARS VISUALIZATION
   ───────────────────────────────────────────────────────────── */
function renderCompBar(val, threshold, maxScale = 30) {
  const pct = Math.min(100, Math.max(0, (val / maxScale) * 100));
  const threshPct = Math.min(100, Math.max(0, (threshold / maxScale) * 100));
  const isOver = val > threshold;
  const barClass = isOver ? "bar-warn" : "bar-ok";
  return `
  <div class="comp-bar-container">
    <div class="comp-bar-track" title="Measured: ${val} | Policy Threshold: ${threshold}">
      <div class="comp-bar-fill ${barClass}" style="width:${pct}%"></div>
      <div class="comp-threshold-line" style="left:${threshPct}%"></div>
    </div>
    <div class="comp-bar-label">
      <span style="${isOver ? 'color:var(--signal-warn);font-weight:700' : ''}">${val}</span>
      <span class="mut">lim ${threshold}</span>
    </div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────
   CODE SYNTAX HIGHLIGHTER (Python, YAML, Markdown, Diff)
   ───────────────────────────────────────────────────────────── */
function highlightCode(raw) {
  let s = esc(raw);
  // Comments
  s = s.replace(/(#[^\n]*)/g, '<span class="syn-comm">$1</span>');
  // Strings
  s = s.replace(/(".*?"|'.*?'|`.*?`)/g, '<span class="syn-str">$1</span>');
  // Numbers
  s = s.replace(/\b(\d+)\b/g, '<span class="syn-num">$1</span>');
  // Python keywords
  const kw = [
    "def","class","import","from","as","return","if","elif","else","try","except",
    "finally","raise","with","for","while","pass","break","continue","in","is",
    "and","or","not","yield","async","await","lambda","True","False","None"
  ];
  const kwRegex = new RegExp(`\\b(${kw.join("|")})\\b`, "g");
  s = s.replace(kwRegex, '<span class="syn-kw">$1</span>');
  return s;
}

async function openDiff(path) {
  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="pill">DIFF INSPECTOR</span>
            <code style="font-size:14px;font-weight:700">${esc(path)}</code>
          </div>
          <button class="b s" onclick="closeDiffModal()">✕ Close (Esc)</button>
        </div>
        <div class="modal-body" style="padding:24px">
          <div class="small mut">Loading diff and Shield finding telemetry…</div>
        </div>
      </div>
    </div>
  `;

  try {
    const data = await api(`/api/diff?path=${encodeURIComponent(path)}`);
    renderDiffModalContent(data);
  } catch (e) {
    container.innerHTML = `
      <div class="modal-overlay" onclick="closeDiffModal()">
        <div class="modal-window">
          <div class="modal-header">
            <h3>Diff Error</h3>
            <button class="b s" onclick="closeDiffModal()">✕</button>
          </div>
          <div class="modal-body" style="padding:24px">
            <div class="err">${esc(e.message)}</div>
          </div>
        </div>
      </div>
    `;
  }
}

function renderDiffModalContent(data) {
  const findingsByLine = {};
  (data.findings || []).forEach(f => {
    const ln = f.line || 0;
    if (!findingsByLine[ln]) findingsByLine[ln] = [];
    findingsByLine[ln].push(f);
  });

  const lines = (data.diff || "").split("\n");
  let oldLn = 0, newLn = 0;
  let rowsHtml = "";

  // If there are top-of-file findings (e.g. blocked-path)
  if (findingsByLine[0]) {
    findingsByLine[0].forEach(f => {
      rowsHtml += `
        <tr>
          <td colspan="3" style="padding:0">
            <div class="diff-annot-box ${f.severity === 'block' ? 'diff-annot-block' : 'diff-annot-warn'}">
              <span class="annot-tag">${esc(f.severity)}</span>
              <div>
                <b>Shield Rule [${esc(f.rule)}]</b>: ${esc(f.message)}
                ${f.evidence ? `<div><code style="background:var(--bg-input);padding:2px 6px;border-radius:4px">${esc(f.evidence)}</code></div>` : ""}
              </div>
            </div>
          </td>
        </tr>
      `;
    });
  }

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("@@")) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) {
        oldLn = parseInt(m[1], 10);
        newLn = parseInt(m[2], 10);
      }
      rowsHtml += `
        <tr class="diff-line-hunk">
          <td class="diff-ln">…</td>
          <td class="diff-ln">…</td>
          <td class="diff-code">${esc(l)}</td>
        </tr>
      `;
      continue;
    }

    let lineClass = "";
    let curOld = "", curNew = "";

    if (l.startsWith("+") && !l.startsWith("+++")) {
      lineClass = "diff-line-add";
      curNew = newLn++;
    } else if (l.startsWith("-") && !l.startsWith("---")) {
      lineClass = "diff-line-del";
      curOld = oldLn++;
    } else if (l.startsWith(" ")) {
      curOld = oldLn++;
      curNew = newLn++;
    } else {
      // Header lines (diff --git, index, etc)
      rowsHtml += `
        <tr>
          <td class="diff-ln"></td>
          <td class="diff-ln"></td>
          <td class="diff-code mut">${esc(l)}</td>
        </tr>
      `;
      continue;
    }

    rowsHtml += `
      <tr class="${lineClass}">
        <td class="diff-ln">${curOld}</td>
        <td class="diff-ln">${curNew}</td>
        <td class="diff-code">${highlightCode(l)}</td>
      </tr>
    `;

    // Check for inline Shield finding on this line
    const matchLine = curNew || curOld;
    if (matchLine && findingsByLine[matchLine]) {
      findingsByLine[matchLine].forEach(f => {
        rowsHtml += `
          <tr>
            <td colspan="3" style="padding:0">
              <div class="diff-annot-box ${f.severity === 'block' ? 'diff-annot-block' : 'diff-annot-warn'}">
                <span class="annot-tag">${esc(f.severity)}</span>
                <div>
                  <b>Shield Finding [${esc(f.rule)}]</b>: ${esc(f.message)}
                  ${f.evidence ? `<div><code style="background:var(--bg-input);padding:2px 6px;border-radius:4px">${esc(f.evidence)}</code></div>` : ""}
                </div>
              </div>
            </td>
          </tr>
        `;
      });
    }
  }

  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="pill ${data.status === 'A' ? 'p-ok' : data.status === 'D' ? 'p-block' : 'p-warn'}">${esc(data.status)}</span>
            <code style="font-size:14px;font-weight:700">${esc(data.path)}</code>
            <span class="mut small">${(data.findings || []).length} Shield annotations</span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="b s" onclick="closeDiffModal()">✕ Close (Esc)</button>
          </div>
        </div>
        <div class="modal-body">
          <table class="diff-viewer">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function closeDiffModal() {
  $("#modalContainer").innerHTML = "";
}

/* ─────────────────────────────────────────────────────────────
   VIEW: REVIEW (VERDICT HERO + GATE CHECKLIST + PR MAP)
   ───────────────────────────────────────────────────────────── */
function vReview() {
  const r = S.rev;
  if (!r) {
    return `<div class="telemetry-card"><button class="b" onclick="runReview()">Run review on current branch</button></div>`;
  }

  const c = r.counts;
  const isAllowed = r.decision === "ALLOWED";
  const isBlocked = r.decision === "BLOCKED";
  const isGateFail = r.decision === "CHANGES_REQUIRED";

  // Gate statuses
  const shieldOk = c.blocks === 0;
  const gateOk = c.gate === 0;
  const testsOk = isAllowed || (S.prop && S.prop.tests && S.prop.tests.ok);
  const humanOk = isAllowed || (S.prop && S.prop.applied);

  // Next action button
  let actionBtn = "";
  if (isBlocked) {
    actionBtn = `<button class="b d" disabled title="Blocked changes cannot be merged">⛔ Not Waivable (Fix &amp; Push)</button>`;
  } else if (isGateFail) {
    actionBtn = `<button class="b" onclick="go('optimizer');runOpt()">Run optimizer →</button>`;
  } else {
    actionBtn = `<button class="b g" onclick="runReview()">✓ Ready to Merge</button>`;
  }

  // Changed files with AI authorship tags & risk indicator
  const fx = r.files.map(f => {
    const aiTag = f.ai 
      ? `<span class="pill p-ai"><svg style="width:11px;height:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg> AI-Authored</span><div class="mut small" style="margin-top:2px">${esc(f.actors.join(", "))}</div>`
      : `<span class="pill"><svg style="width:11px;height:11px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Human</span><div class="mut small" style="margin-top:2px">${esc(f.actors.join(", "))}</div>`;
    const statusChip = f.status === "A" ? `<span class="pill p-ok">ADD</span>` : f.status === "D" ? `<span class="pill p-block">DEL</span>` : `<span class="pill">MOD</span>`;
    
    const hasBlocks = f.findings.some(x => x.severity === "block");
    const hasWarns = f.findings.some(x => x.severity === "warn");
    const riskChip = hasBlocks 
      ? `<span class="file-risk-chip err">⛔ High Risk (${f.findings.length})</span>` 
      : hasWarns 
      ? `<span class="file-risk-chip" style="color:var(--signal-warn)">⚠️ Warn (${f.findings.length})</span>` 
      : `<span class="file-risk-chip good">✓ Clean</span>`;

    const findingsList = f.findings.map(x => sev(x.severity) + " " + esc(x.rule) + (x.line ? ":" + x.line : "")).join("<br>") || '<span class="good small">✓ Clean</span>';
    
    return `<tr class="pr-file-row" onclick="openDiff('${esc(f.path)}')" title="Click to view file diff with inline annotations">
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <code>${esc(f.path)}</code>
          <span class="mut small" style="font-size:11px">inspect diff →</span>
        </div>
      </td>
      <td>${statusChip}</td>
      <td>${aiTag}</td>
      <td>${riskChip}</td>
      <td>${findingsList}</td>
    </tr>`;
  }).join("");

  // Detailed findings table
  const det = r.findings.map(f => `<tr>
    <td>${sev(f.severity)}</td>
    <td><code onclick="openDiff('${esc(f.file)}')" style="cursor:pointer;color:var(--brand-accent)" title="Open in diff inspector">${esc(f.file)}${f.line ? ":" + f.line : ""}</code></td>
    <td><b>${esc(f.rule)}</b></td>
    <td>${esc(f.message)}${f.evidence ? `<div><code style="color:var(--signal-warn)">${esc(f.evidence)}</code></div>` : ""}</td>
  </tr>`).join("");

  // Complexity gate table with HORIZONTAL BARS
  const gate = r.gate.map(g => `<tr>
    <td><code>${esc(g.file)}::${esc(g.name)}</code></td>
    <td>${renderCompBar(g.cc, 10, 25)}</td>
    <td>${renderCompBar(g.cog, 15, 30)}</td>
    <td>${renderCompBar(g.depth, 3, 8)}</td>
    <td><span class="mut small">${esc(g.why.join("; "))}</span></td>
  </tr>`).join("");

  return `
  <!-- Verdict Hero -->
  <div class="verdict v-${esc(r.decision)}">
    <div class="verdict-banner">
      <div class="verdict-badge">
        <div class="verdict-icon-box">
          ${isAllowed 
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : isBlocked
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'}
        </div>
        <div>
          <div class="big">${esc(r.decision.replace("_", " "))}</div>
          <div class="mut small">Policy Source: <code>${esc(r.policy_source)}</code></div>
        </div>
      </div>
      <div class="verdict-summary">
        <div class="verdict-reason">${esc(r.reason)}</div>
        <div class="verdict-meta">${c.files} changed files (${c.ai_files} AI-authored) · ${c.blocks} blocking · ${c.warnings} warnings · ${c.gate} complexity violations</div>
      </div>
      <div class="verdict-action-slot">
        ${actionBtn}
        <button class="b s" onclick="runReview()" title="Re-evaluate change against base">Re-run</button>
      </div>
    </div>

    <!-- 4-Gate Telemetry Checklist -->
    <div class="gate-checklist">
      <div class="gate-item ${shieldOk ? 'gate-pass' : 'gate-fail'}">
        <div class="gate-icon">

function diffHtml(d) {
  return d.split("\n").map(l => {
    const cls = l[0] === "+" && !l.startsWith("+++") ? "a" : l[0] === "-" && !l.startsWith("---") ? "r" : l.startsWith("@@") ? "h" : "";
    return `<div class="${cls}">${esc(l) || " "}</div>`;
  }).join("");
}

/* ─────────────────────────────────────────────────────────────
   VIEW: OPTIMIZER (AST REWRITE + TEST SANDBOX)
   ───────────────────────────────────────────────────────────── */
function vOpt() {
  const p = S.prop, st = S.state;
  const ai = st && st.llm.allowed 
    ? `<label style="display:inline-flex;gap:6px;align-items:center;margin:0 10px"><input type="checkbox" id="useai" style="width:auto" ${st.llm.available ? "" : "disabled"}> AI tier ${st.llm.available ? "" : "(set ANTHROPIC_API_KEY)"}</label>`
    : `<span class="mut small" style="margin:0 10px">AI tier off (policy allow_llm: false)</span>`;

  let h = `<div class="telemetry-card">
    <div class="row">
      <div>
        <b>Semantics-Preserving AST Optimizer</b>
        <div class="mut small">Rewrites only functions changed by this PR, executes full test suite on an isolated copy with secrets scrubbed, and computes complexity reduction deltas. Nothing is committed without explicit human approval.</div>
      </div>
      <div style="flex:none">${ai}<button class="b" onclick="runOpt()" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Running tests…' : 'Run optimizer'}</button></div>
    </div>
  </div>`;

  if (!p) return h;

  const cls = p.status === "verified" ? "p-ok" : p.status.includes("partial") ? "p-warn" : p.status === "nothing-to-optimize" ? "" : "p-block";
  h += `<div class="telemetry-card">
    <h3>Optimizer Execution Telemetry ${pill(p.status, cls)}</h3>
    ${p.tests.ran ? `<div class="small" style="margin-bottom:6px">Test Execution: <code>${esc(p.tests.cmd)}</code> → ${p.tests.ok ? '<span class="good">PASSED</span>' : '<span class="err">FAILED</span>'}</div><pre>${esc((p.tests.output || "").trim().split("\n").slice(-8).join("\n"))}</pre>` : '<div class="small mut">No tests detected in sandbox - proposal is unverified</div>'}
    ${p.llm.requested ? `<div class="small mut" style="margin-top:6px">AI Tier Telemetry: ${p.llm.used ? "used" : "not used"} · ${esc(p.llm.reason)}</div>` : ''}
  </div>`;

  if (p.unexecuted_functions && p.unexecuted_functions.length) {
    h += `<div class="telemetry-card" style="border-left:4px solid var(--signal-warn)">
      <b style="color:var(--signal-warn)">⚠️ Partial Test Coverage Detected</b>: The following rewritten functions were not executed by tests:<br>
      ${p.unexecuted_functions.map(u => `• <code>${esc(u.file)}::${esc(u.function)}</code> (${u.coverage_pct}% executed)`).join("<br>")}
    </div>`;
  }

  h += p.files.map(f => {
    const b = f.metrics.before, a = f.metrics.after;
    const cogDelta = a.max_cog - b.max_cog;
    const depthDelta = a.max_depth - b.max_depth;
    return `<div class="telemetry-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <h3 style="margin:0"><code>${esc(f.path)}</code></h3>
        <div style="display:flex;gap:6px">${Object.entries(f.notes).map(([k, v]) => pill(k + " ×" + v, "p-ai")).join("")}</div>
      </div>
      
      <!-- Paired Before/After Metrics with Large Delta -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:12px;margin:12px 0;padding:12px;background:var(--bg-surface-raised);border-radius:8px">
        <div>
          <div class="mut small">MAX COGNITIVE COMPLEXITY</div>
          <div style="font-size:22px;font-weight:800;font-family:var(--font-mono)">
            ${b.max_cog} <span class="arrow">→</span> <span class="good">${a.max_cog}</span>
            <span style="font-size:14px;color:var(--signal-pass);margin-left:6px">(Δ ${cogDelta})</span>
          </div>
          <div class="mut small">cognitive reduction verified</div>
        </div>
        <div>
          <div class="mut small">MAX NESTING DEPTH</div>
          <div style="font-size:22px;font-weight:800;font-family:var(--font-mono)">
            ${b.max_depth} <span class="arrow">→</span> <span class="good">${a.max_depth}</span>
            <span style="font-size:14px;color:var(--signal-pass);margin-left:6px">(Δ ${depthDelta})</span>
          </div>
          <div class="mut small">depth reduction verified</div>
        </div>
        <div>
          <div class="mut small">SOURCE LINES OF CODE</div>
          <div style="font-size:22px;font-weight:800;font-family:var(--font-mono)">
            ${b.loc} <span class="arrow">→</span> <span class="good">${a.loc}</span>
          </div>
          <div class="mut small">max cyclomatic: ${b.max_cc} → ${a.max_cc}</div>
        </div>
      </div>

      <table style="margin:10px 0">
        <thead><tr><th>Function</th><th>Cyclomatic (CC)</th><th>Cognitive</th><th>Depth</th></tr></thead>
        <tbody>
          ${f.metrics.functions.map(x => `<tr>
            <td><code>${esc(x.name)}</code></td>
            <td>${x.before.cc} → ${x.after.cc}</td>
            <td>${x.before.cog} → <b class="${x.after.cog < x.before.cog ? 'good' : ''}">${x.after.cog}</b></td>
            <td>${x.before.depth} → <b class="${x.after.depth < x.before.depth ? 'good' : ''}">${x.after.depth}</b></td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${f.remaining.length ? `<div class="small err" style="margin:8px 0">Still over limits: ${esc(f.remaining.map(r => r.name).join(", "))} — requires human intervention or AI refactor tier</div>` : ''}
      <pre class="diff">${diffHtml(f.diff)}</pre>
    </div>`;
  }).join("");

  if (p.skipped.length) {
    h += `<div class="telemetry-card">
      <h3>Skipped Functions (Preserved Unmodified)</h3>
      ${p.skipped.map(s => `<div class="small"><code>${esc(s.file || "")}::${esc(s.function)}</code> — ${esc(s.reason)}</div>`).join("")}
    </div>`;
  }

  if (p.applicable && p.files.length && !p.applied) {
    const covHint = st && st.policy && st.policy.min_function_coverage !== null ? `<span class="mut small">(policy min_function_coverage: ${st.policy.min_function_coverage}%)</span>` : "";
    h += `<div class="telemetry-card" style="border-left:4px solid var(--signal-pass)">
      <h3>Human Approval Gate ${covHint}</h3>
      <div class="small mut" style="margin-bottom:10px">
        <b>Proposed Action:</b> Apply semantics-preserving AST rewrites to <code>${esc(p.files.map(f => f.path).join(", "))}</code>.<br>
        <b>Commit Message Trailer:</b> <code>Approved-by: [Your Name]</code> (signed and permanently anchored in the SHA-256 audit chain).
      </div>
      <div class="row">
        <div>
          <label>Approver Full Name (Required)</label>
          <input id="aactor" placeholder="Enter your full name (e.g. Priya Sharma)" oninput="checkApproverName()">
        </div>
        <button class="b g" id="btnApprove" onclick="approve()">Approve &amp; apply</button>
      </div>
    </div>`;
  }

  if (p.applied) {
    h += `<div class="telemetry-card" style="border-left:4px solid var(--signal-pass)">
      <span class="good" style="font-size:15px;font-weight:700">Applied as commit</span> <code>${esc(String(p.applied.commit).slice(0, 8))}</code>. Re-run PR review to verify merge readiness.
    </div>`;
  }

  return h;
}

/* ─────────────────────────────────────────────────────────────
   VIEW: AUDIT TRAIL & TAMPER DETECTION (VERTICAL TIMELINE CHAIN)
   ───────────────────────────────────────────────────────────── */
function vAudit() {
  const a = S.audit;
  if (!a) return "";
  const t = S.tamper;

  const entriesHtml = a.entries.map((e, idx) => {
    const isTampered = t && !t.ok && e.seq === t.tampered_seq;
    const isDownstream = t && !t.ok && e.seq > t.tampered_seq;
    const nodeClass = isTampered ? "tampered" : isDownstream ? "downstream-broken" : "";
    const prevHash = e.prev_hash ? String(e.prev_hash).slice(0, 8) : "GENESIS";
    const curHash = e.hash ? String(e.hash).slice(0, 8) : "…";

    return `
    <div class="audit-node ${nodeClass}" id="auditNode_${e.seq}">
      <div class="chain-line-col">
        <div class="chain-node-dot"></div>
        <div class="chain-connector"></div>
      </div>
      <div class="audit-node-body">
        <div class="audit-node-header">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="audit-seq">#${e.seq}</span>
            <b>${esc(e.event)}</b>
            <span class="pill ${e.decision === 'ALLOWED' || e.decision === 'APPLIED' ? 'p-ok' : e.decision === 'BLOCKED' ? 'p-block' : 'p-warn'}">${esc(e.decision)}</span>
          </div>
          <div class="audit-hash-link">
            <span>link: <code>${prevHash}</code> → <b>${curHash}</b></span>
          </div>
        </div>
        <div class="small" style="margin-bottom:4px">
          Actor: <code>${esc(e.actor || "system")}</code> · <span class="mut">${esc(e.ts)}</span>
        </div>
        <div class="small mut">${esc(e.detail)}</div>
        ${isTampered ? `<div class="small err" style="margin-top:6px;font-weight:700">⛔ IN-MEMORY TAMPERING SIMULATED HERE: SHA-256 signature invalidated</div>` : ""}
        ${isDownstream ? `<div class="small err" style="margin-top:6px">⛓💥 DOWNSTREAM CHAIN BROKEN: Previous hash link mismatch propagates to repository head</div>` : ""}
      </div>
    </div>`;
  }).join("");

  return `
  <div class="telemetry-card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div>
        <h3 style="margin:0 0 6px 0">Cryptographic Hash-Chained Audit Trail</h3>
        <div class="small">
          Chain Status: ${a.chain.ok ? '<span class="good">VERIFIED ✓</span>' : `<span class="err">BROKEN at #${a.chain.broken_at}: ${esc(a.chain.reason)}</span>`} · ${a.chain.count} entries
          <span class="mut" style="margin-left:10px">Head: <code>${esc(String(a.chain.head || "").slice(0, 16))}…</code></span>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="b" onclick="verifyChainAnimation()">Verify Chain</button>
        <button class="b s" onclick="tamper()">Simulate tampering</button>
        <button class="b s" onclick="dl('/api/report.md','repobrain-report.md')">Export report (.md)</button>
        <button class="b s" onclick="dlj()">Export JSON</button>
      </div>
    </div>
    
    ${t ? `<div class="small" style="margin-top:14px;padding:12px 16px;background:var(--signal-block-bg);border:1px solid var(--signal-block-border);border-radius:8px">
      <b>Tamper Simulation Telemetry:</b> Edited entry #${t.tampered_seq} in memory.<br>
      Cryptographic Chain Verification: 
      ${t.ok ? 'passed (!)' : `<span class="err" style="font-weight:700">DETECTED — ${esc(t.reason)}</span>`} 
      <div class="mut small" style="margin-top:4px">Notice how modifying historical log entry #${t.tampered_seq} invalidates every single downstream cryptographic link in the chain. The physical append-only log on disk remains tamper-evident.</div>
    </div>` : ""}
  </div>

  <div class="telemetry-card">
    <h3>Cryptographic Blockchain Ledger (${a.entries.length} Blocks)</h3>
    <div class="audit-timeline">
      ${entriesHtml}
    </div>
  </div>
  `;
}

function verifyChainAnimation() {
  const nodes = document.querySelectorAll(".audit-node");
  nodes.forEach((n, i) => {
    setTimeout(() => {
      n.classList.add("sweep-active");
      setTimeout(() => n.classList.remove("sweep-active"), 400);
    }, i * 60);
  });
  setTimeout(() => {
    toast(`✓ Cryptographic chain verification complete: ${nodes.length} blocks verified without tampering.`);
  }, nodes.length * 60 + 200);
}

  { label: "Switch to Scenario C (AI Refactor)", action: () => scenario("orders") },

  { label: "Go to Shield Playground", action: () => go("shield") },
  { label: "Go to Failure Explainer", action: () => go("explainer") },

  { label: "Simulate Log Tampering", action: () => { go("audit"); setTimeout(tamper, 200); } },

function openCmdPalette() {
  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="cmd-box">
        <div class="cmd-input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input class="cmd-input" id="cmdInput" placeholder="Type a command or navigate…" autofocus oninput="filterCmds()">
        </div>
        <div class="cmd-list" id="cmdList"></div>
      </div>
    </div>
  `;
  filterCmds();
  $("#cmdInput").focus();
}

function filterCmds() {
  const q = ($("#cmdInput").value || "").toLowerCase();
  const list = $("#cmdList");
  const filtered = COMMANDS.filter(c => c.label.toLowerCase().includes(q));
  list.innerHTML = filtered.map((c, i) => `
    <div class="cmd-item ${i === 0 ? 'selected' : ''}" onclick="executeCmd(${COMMANDS.indexOf(c)})">
      <span>${esc(c.label)}</span>
      <kbd>↵</kbd>
    </div>
  `).join("") || `<div class="small mut" style="padding:16px;text-align:center">No commands match "${esc(q)}"</div>`;
}

function executeCmd(idx) {
  closeDiffModal();
  COMMANDS[idx].action();
}

function openShortcutsModal() {
  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="modal-window" style="max-width:540px">
        <div class="modal-header">
          <h3 style="margin:0">Keyboard Shortcuts</h3>
          <button class="b s" onclick="closeDiffModal()">✕</button>
        </div>
        <div class="modal-body" style="padding:20px">
          <table>
            <tbody>
              <tr><td><kbd>1</kbd></td><td>Navigate to PR Review</td></tr>
              <tr><td><kbd>2</kbd></td><td>Navigate to Optimizer</td></tr>
              <tr><td><kbd>3</kbd></td><td>Navigate to Shield Playground</td></tr>
              <tr><td><kbd>4</kbd></td><td>Navigate to Failure Explainer</td></tr>
              <tr><td><kbd>5</kbd></td><td>Navigate to Audit &amp; Report</td></tr>
              <tr><td><kbd>6</kbd></td><td>Navigate to Policy Inspector</td></tr>
              <tr><td><kbd>O</kbd></td><td>Trigger Optimizer Run</td></tr>
              <tr><td><kbd>A</kbd></td><td>Focus Approver Full Name input</td></tr>
              <tr><td><kbd>⌘K</kbd> / <kbd>^K</kbd></td><td>Open Command Palette</td></tr>
              <tr><td><kbd>?</kbd></td><td>Open Keyboard Shortcuts (this sheet)</td></tr>
              <tr><td><kbd>Esc</kbd></td><td>Close Modals / Overlays</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// Global Keyboard Handler
window.addEventListener("keydown", e => {
  // If typing in an input or textarea, ignore single keys
  const tag = (e.target && e.target.tagName) || "";
  const isInput = tag === "INPUT" || tag === "TEXTAREA";

  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    openCmdPalette();
    return;
  }

  if (e.key === "Escape") {
    closeDiffModal();
    return;
  }

  if (isInput) return;

  if (e.key === "1") go("review");
  else if (e.key === "2") go("optimizer");
  else if (e.key === "3") go("shield");
  else if (e.key === "4") go("explainer");
  else if (e.key === "5") go("audit");
  else if (e.key === "6") go("policy");
  else if (e.key.toLowerCase() === "o") { go("optimizer"); runOpt(); }
  else if (e.key.toLowerCase() === "a") {
    go("optimizer");
    setTimeout(() => { const el = $("#aactor"); if (el) el.focus(); }, 150);
  }
  else if (e.key === "?") openShortcutsModal();
});

function toggleTour() {
  S.tourActive = !S.tourActive;
  const hud = $("#tourHud");
  if (S.tourActive) {
    S.tourIndex = 0;
    hud.style.display = "flex";
    applyTourStep();
  } else {
    hud.style.display = "none";
    closeDiffModal();
  }
}

function applyTourStep() {
  const step = TOUR_STEPS[S.tourIndex];
  $("#tourStepBadge").textContent = `Step ${S.tourIndex + 1}/${TOUR_STEPS.length}`;
  $("#tourStepTitle").textContent = step.title;
  $("#tourStepDesc").textContent = step.desc;
  step.action();
}

function nextTourStep() {
  if (S.tourIndex < TOUR_STEPS.length - 1) {
    S.tourIndex++;
    applyTourStep();
  } else {
    toggleTour();
    toast("Guided presenter tour complete!");
  }
}

function prevTourStep() {
  if (S.tourIndex > 0) {
    S.tourIndex--;
    applyTourStep();
  }
}

/* ─────────────────────────────────────────────────────────────
   RENDER PIPELINE & MOUNT
   ───────────────────────────────────────────────────────────── */
function render() {
  if (!S.state) return;
  const viewMap = {
    review: vReview,
    optimizer: vOpt,
    shield: vShield,
    explainer: vExpl,
    audit: vAudit,
    policy: vPolicy
  };
  const v = viewMap[S.tab] || vReview;

  // Preserve input state across re-renders
  const keep = {};
  document.querySelectorAll("#main input, #main textarea").forEach(e => {
    if (e.id) keep[e.id] = e.type === "checkbox" ? e.checked : e.value;
  });

  $("#main").innerHTML = v();

  for (const [k, val] of Object.entries(keep)) {
    const e = document.getElementById(k);
    if (e) {
      if (e.type === "checkbox") e.checked = val;
      else e.value = val;
    }
  }

  $("#main").classList.toggle("busy", S.busy);
  updatePipelineTelemetry();
}

(async () => {
  initTheme();
  nav();
  try {
    await loadState();
    S.rev = await api("/api/review", {});
    render();
    audit();
  } catch (e) {
    $("#main").innerHTML = `<div class="telemetry-card err">${esc(e.message)}</div>`;
  }
})();
</script>
