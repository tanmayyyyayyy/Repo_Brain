<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="42" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="-0.5">RepoBrain Architecture</text>
  <text x="40" y="64" fill="#94a3b8" font-size="13">Vendor-neutral governance, verified AST cleanup, and cryptographic proof for repositories touched by AI agents</text>

  <!-- Flow Connectors (Background Lines) -->
  <path d="M 175 160 L 210 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 350 160 L 385 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 525 160 L 560 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 700 160 L 735 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 875 160 L 910 160" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Stage 0: Input / PR -->
  <g transform="translate(35, 105)" filter="url(#shadow)">
    <rect width="140" height="110" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="26" cy="30" r="10" fill="#a78bfa" fill-opacity="0.2" />
    <text x="26" y="34" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">AI</text>
    <text x="45" y="34" fill="#f8fafc" font-size="14" font-weight="600">PR / Push</text>
    <text x="16" y="60" fill="#cbd5e1" font-size="11">Agent or Contributor</text>
    <text x="16" y="78" fill="#94a3b8" font-size="10">• Claude, Cursor, Devin</text>
    <text x="16" y="94" fill="#94a3b8" font-size="10">• Untrusted diff</text>
  </g>

  <!-- Stage 1: Shield -->
  <g transform="translate(210, 105)" filter="url(#shadow)">
    <rect width="140" height="110" rx="8" fill="url(#cardGrad)" stroke="#f87171" stroke-width="1.5" />
    <rect x="12" y="18" width="60" height="20" rx="4" fill="#f87171" fill-opacity="0.15" />
    <text x="42" y="32" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">1. SHIELD</text>
    <text x="14" y="58" fill="#f8fafc" font-size="12" font-weight="600">Policy &amp; Secrets</text>
    <text x="14" y="75" fill="#94a3b8" font-size="10">• Protected paths</text>
    <text x="14" y="89" fill="#94a3b8" font-size="10">• Hardcoded keys</text>
    <text x="14" y="103" fill="#94a3b8" font-size="10">• Prompt injection</text>
  </g>

  <!-- Stage 2: Complexity Gate -->
  <g transform="translate(385, 105)" filter="url(#shadow)">
    <rect width="140" height="110" rx="8" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="12" y="18" width="56" height="20" rx="4" fill="#fbbf24" fill-opacity="0.15" />
    <text x="40" y="32" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">2. GATE</text>
    <text x="14" y="58" fill="#f8fafc" font-size="12" font-weight="600">Code Metrics</text>
    <text x="14" y="75" fill="#94a3b8" font-size="10">• Cyclomatic &le; 10</text>
    <text x="14" y="89" fill="#94a3b8" font-size="10">• Cognitive &le; 15</text>
    <text x="14" y="103" fill="#94a3b8" font-size="10">• Nesting depth &le; 3</text>
  </g>

  <!-- Stage 3: Optimizer -->
  <g transform="translate(560, 105)" filter="url(#shadow)">
    <rect width="140" height="110" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="12" y="18" width="85" height="20" rx="4" fill="#38bdf8" fill-opacity="0.15" />
    <text x="54" y="32" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">3. OPTIMIZER</text>
    <text x="14" y="58" fill="#f8fafc" font-size="12" font-weight="600">AST Rewriter</text>
    <text x="14" y="75" fill="#94a3b8" font-size="10">• Scratch sandbox</text>
    <text x="14" y="89" fill="#94a3b8" font-size="10">• Runs test suite</text>
    <text x="14" y="103" fill="#94a3b8" font-size="10">• Differential fuzz</text>
  </g>

  <!-- Stage 4: Human Approval -->
  <g transform="translate(735, 105)" filter="url(#shadow)">
    <rect width="140" height="110" rx="8" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" />
    <rect x="12" y="18" width="68" height="20" rx="4" fill="#34d399" fill-opacity="0.15" />
    <text x="46" y="32" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">4. HUMAN</text>
    <text x="14" y="58" fill="#f8fafc" font-size="12" font-weight="600">Approval &amp; Git</text>
    <text x="14" y="75" fill="#94a3b8" font-size="10">• Named reviewer</text>
    <text x="14" y="89" fill="#94a3b8" font-size="10">• Approved-by trailer</text>
    <text x="14" y="103" fill="#94a3b8" font-size="10">• Verdict: ALLOWED</text>
  </g>

  <!-- Connectors from Stages to Audit Log -->
  <path d="M 280 215 L 280 270" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5" />
  <path d="M 455 215 L 455 270" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5" />
  <path d="M 630 215 L 630 270" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5" />
  <path d="M 805 215 L 805 270" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5" />

  <!-- Foundation: Cryptographic Audit Ledger -->
  <g transform="translate(35, 270)" filter="url(#shadow)">
    <rect width="840" height="115" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Left branding block -->
    <rect x="16" y="16" width="180" height="83" rx="6" fill="#090d16" stroke="#1e293b" />
    <text x="28" y="38" fill="#38bdf8" font-size="12" font-weight="700">AUDIT LEDGER</text>
    <text x="28" y="56" fill="#f8fafc" font-size="11">Append-Only JSONL</text>
    <text x="28" y="72" fill="#94a3b8" font-size="10">HMAC-SHA256 signed</text>
    <text x="28" y="86" fill="#94a3b8" font-size="10">CI Head Anchoring</text>

    <!-- Hash Chain Blocks -->
    <!-- Block 1 -->
    <g transform="translate(215, 20)">
      <rect width="135" height="75" rx="5" fill="#0b1324" stroke="#334155" />
      <text x="10" y="22" fill="#f8fafc" font-size="11" font-weight="600">Block #1: review</text>
      <text x="10" y="40" fill="#f87171" font-size="10" font-weight="700">BLOCKED</text>
      <text x="10" y="56" fill="#64748b" font-size="9" font-family="monospace">prev: 00000000…</text>
      <text x="10" y="68" fill="#38bdf8" font-size="9" font-family="monospace">hash: a7e39b10…</text>
    </g>
    <path d="M 350 57 L 375 57" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Block 2 -->
    <g transform="translate(375, 20)">
      <rect width="135" height="75" rx="5" fill="#0b1324" stroke="#334155" />
      <text x="10" y="22" fill="#f8fafc" font-size="11" font-weight="600">Block #2: optimize</text>
      <text x="10" y="40" fill="#38bdf8" font-size="10" font-weight="700">PROPOSED</text>
      <text x="10" y="56" fill="#64748b" font-size="9" font-family="monospace">prev: a7e39b10…</text>
      <text x="10" y="68" fill="#38bdf8" font-size="9" font-family="monospace">hash: 4c9f1802…</text>
    </g>
    <path d="M 510 57 L 535 57" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Block 3 -->
    <g transform="translate(535, 20)">
      <rect width="135" height="75" rx="5" fill="#0b1324" stroke="#334155" />
      <text x="10" y="22" fill="#f8fafc" font-size="11" font-weight="600">Block #3: approve</text>
      <text x="10" y="40" fill="#34d399" font-size="10" font-weight="700">APPLIED</text>
      <text x="10" y="56" fill="#64748b" font-size="9" font-family="monospace">prev: 4c9f1802…</text>
      <text x="10" y="68" fill="#34d399" font-size="9" font-family="monospace">hash: d308b41e…</text>
    </g>
    <path d="M 670 57 L 695 57" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)" />

    <!-- Anchor Block -->
    <g transform="translate(695, 20)">
      <rect width="130" height="75" rx="5" fill="#032018" stroke="#059669" />
      <text x="10" y="22" fill="#34d399" font-size="11" font-weight="700">Anchored Head</text>
      <text x="10" y="40" fill="#f8fafc" font-size="10">CI Artifact Check</text>
      <text x="10" y="56" fill="#a7f3d0" font-size="9" font-family="monospace">head: d308b41e…</text>
      <text x="10" y="68" fill="#34d399" font-size="9" font-weight="700">&check; VERIFIED</text>
    </g>
  </g>
</svg>
