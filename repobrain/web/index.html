<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepoBrain // Mission Control</title>
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS: FLIGHT RECORDER / MISSION CONTROL
   Strict WCAG 2.1 AA Compliant (Verified >= 4.5:1 text, >= 3:1 UI)
   ───────────────────────────────────────────────────────────── */
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* Dark Mode Default */
  --bg-app: #080c12;
  --bg-rail: #0e131b;
  --bg-surface: #131924;
  --bg-surface-raised: #192231;
  --bg-surface-hover: #212c3e;
  --bg-input: #0b0f16;
  --bg-overlay: rgba(8, 12, 18, 0.88);

  --border-subtle: #253347;
  --border-default: #6b7c93;
  --border-strong: #94a3b8;

  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;
  --text-inverse: #080c12;

  --brand-accent: #38bdf8;
  --brand-accent-hover: #0284c7;
  --brand-accent-glow: rgba(56, 189, 248, 0.25);

  --signal-pass: #34d399;
  --signal-pass-border: #10b981;
  --signal-pass-bg: rgba(52, 211, 153, 0.14);

  --signal-warn: #fbbf24;
  --signal-warn-border: #f59e0b;
  --signal-warn-bg: rgba(251, 191, 36, 0.14);

  --signal-block: #f87171;
  --signal-block-border: #ef4444;
  --signal-block-bg: rgba(248, 113, 113, 0.08);

  --signal-ai: #a78bfa;
  --signal-ai-border: #8b5cf6;
  --signal-ai-bg: rgba(167, 139, 250, 0.08);

  --syn-keyword: #f472b6;
  --syn-string: #34d399;
  --syn-comment: #94a3b8;
  --syn-number: #38bdf8;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.45);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.6);
}

[data-theme="light"] {
  --bg-app: #f4f6f9;
  --bg-rail: #e9eff5;
  --bg-surface: #ffffff;
  --bg-surface-raised: #f8fafc;
  --bg-surface-hover: #edf2f7;
  --bg-input: #ffffff;
  --bg-overlay: rgba(244, 246, 249, 0.88);

  --border-subtle: #cbd5e1;
  --border-default: #768390;
  --border-strong: #475569;

  --text-primary: #0f172a;
  --text-secondary: #1e293b;
  --text-muted: #475569;
  --text-inverse: #ffffff;

  --brand-accent: #0369a1;
  --brand-accent-hover: #075985;
  --brand-accent-glow: rgba(3, 105, 161, 0.2);

  --signal-pass: #03674a;
  --signal-pass-border: #065f46;
  --signal-pass-bg: rgba(3, 103, 74, 0.12);

  --signal-warn: #92400e;
  --signal-warn-border: #78350f;
  --signal-warn-bg: rgba(146, 64, 14, 0.12);

  --signal-block: #b91c1c;
  --signal-block-border: #991b1b;
  --signal-block-bg: rgba(185, 28, 28, 0.12);

  --signal-ai: #5b21b6;
  --signal-ai-border: #4c1d95;
  --signal-ai-bg: rgba(91, 33, 182, 0.12);

  --syn-keyword: #be185d;
  --syn-string: #047857;
  --syn-comment: #52606f;
  --syn-number: #0369a1;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-primary);
  font: 13.5px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  max-width: 100vw;
}

/* Accessible Visually Hidden utility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* High-contrast Visible Focus Rings */
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--brand-accent) !important;
  outline-offset: 2px !important;
  box-shadow: 0 0 0 4px var(--brand-accent-glow) !important;
}

/* Presenter Mode (Larger type, secondary chrome hidden) */
body.presenter-mode {
  font-size: 16px;
  line-height: 1.6;
}
body.presenter-mode .telemetry-rail {
  width: 250px;
}
body.presenter-mode .rail-header:last-of-type,
body.presenter-mode .secondary-tools-group {
  display: none !important;
}
body.presenter-mode .verdict-badge .big {
  font-size: 34px;
}
body.presenter-mode .comp-bar-container {
  min-width: 170px;
}

/* Inline SVG Icon Helper */
.icon-inline {
  width: 14px;
  height: 14px;
  display: inline-block;
  vertical-align: -2px;
  flex-shrink: 0;
}
.icon-inline-sm {
  width: 12px;
  height: 12px;
  display: inline-block;
  vertical-align: -1px;
  flex-shrink: 0;
}

/* ─────────────────────────────────────────────────────────────
   LAYOUT: TELEMETRY TOP BAR & ASYMMETRIC PERSISTENT RAIL
   ───────────────────────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-default);
  z-index: 40;
  gap: 16px;
  flex-shrink: 0;
  max-width: 100vw;
  overflow-x: hidden;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  text-decoration: none;
}
.logo-icon {
  width: 22px;
  height: 22px;
  color: var(--brand-accent);
}
.live-pill {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--signal-pass-bg);
  color: var(--signal-pass);
  border: 1px solid var(--signal-pass-border);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.meta-chip {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-surface-raised);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}

.scenarios-group {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-app);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--border-default);
}
.scen-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0 6px;
}
.scen-btn {
  background: transparent;
  color: var(--text-secondary);
  border: 0;
  border-radius: 5px;
  padding: 5px 11px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.scen-btn:hover {
  color: var(--text-primary);
  background: var(--bg-surface-hover);
}
.scen-btn.active {
  color: var(--brand-accent);
  background: var(--bg-surface);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-default);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.action-chip-btn {
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.action-chip-btn:hover {
  color: var(--text-primary);
  border-color: var(--brand-accent);
  background: var(--bg-surface-hover);
}
.action-chip-btn kbd {
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-family: var(--font-mono);
}
.icon-btn {
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}
.icon-btn:hover {
  color: var(--text-primary);
  border-color: var(--brand-accent);
  background: var(--bg-surface-hover);
}
.icon-btn svg { width: 16px; height: 16px; }

/* Mobile Menu Toggle */
.mobile-menu-btn {
  display: none;
  background: var(--bg-surface-raised);
  color: var(--text-secondary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.mobile-menu-btn svg { width: 18px; height: 18px; }

/* App Main Frame */
.app-frame {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 52px);
  position: relative;
  max-width: 100vw;
}

/* Left Rail: Flight Pipeline Stepper & Tools */
.telemetry-rail {
  width: 290px;
  background: var(--bg-rail);
  border-right: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  user-select: none;
  transition: transform 0.2s ease;
}
.rail-header {
  padding: 16px 18px 8px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  justify-content: space-between;
}
.rail-header .pill {
  font-size: 9.5px;
  padding: 2px 7px;
  letter-spacing: 0.02em;
  max-width: 100%;
}
.pipeline-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 10px;
}
.pipeline-node {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  text-align: left;
  background: transparent;
  color: var(--text-primary);
  width: 100%;
}
.pipeline-node:hover {
  background: var(--bg-surface-hover);
}
.pipeline-node.active {
  background: var(--bg-surface);
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}
.node-status-icon {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.node-status-icon svg { width: 12px; height: 12px; }
.status-pass { background: var(--signal-pass-bg); color: var(--signal-pass); border: 1px solid var(--signal-pass-border); }
.status-warn { background: var(--signal-warn-bg); color: var(--signal-warn); border: 1px solid var(--signal-warn-border); }
.status-block { background: var(--signal-block-bg); color: var(--signal-block); border: 1px solid var(--signal-block-border); }
.status-pending { background: var(--bg-surface-raised); color: var(--text-muted); border: 1px solid var(--border-default); }

.node-info { flex: 1; min-width: 0; }
.node-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.node-title-row .pill {
  font-size: 10px;
  padding: 2px 8px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  border-radius: 99px;
}
.node-title-row .pill.p-ready,
.pill.p-ready {
  color: #38bdf8 !important;
  background: rgba(56, 189, 248, 0.18) !important;
  border: 1px solid #0284c7 !important;
  font-weight: 700 !important;
}
.node-title-row .pill.p-warn,
.pill.p-warn {
  color: #fbbf24 !important;
  background: rgba(251, 191, 36, 0.22) !important;
  border: 1px solid #f59e0b !important;
  font-weight: 700 !important;
}
.node-title-row .pill.p-ok,
.pill.p-ok {
  color: #34d399 !important;
  background: rgba(52, 211, 153, 0.22) !important;
  border: 1px solid #10b981 !important;
  font-weight: 700 !important;
}
.node-title-row .pill.p-block,
.pill.p-block {
  color: #f87171 !important;
  background: rgba(248, 113, 113, 0.22) !important;
  border: 1px solid #ef4444 !important;
  font-weight: 700 !important;
}
[data-theme="light"] .node-title-row .pill.p-ready,
[data-theme="light"] .pill.p-ready {
  color: #0369a1 !important;
  background: #e0f2fe !important;
  border: 1px solid #0284c7 !important;
}
[data-theme="light"] .node-title-row .pill.p-warn,
[data-theme="light"] .pill.p-warn {
  color: #92400e !important;
  background: #fef3c7 !important;
  border: 1px solid #d97706 !important;
}
[data-theme="light"] .node-title-row .pill.p-ok,
[data-theme="light"] .pill.p-ok {
  color: #065f46 !important;
  background: #d1fae5 !important;
  border: 1px solid #059669 !important;
}
[data-theme="light"] .node-title-row .pill.p-block,
[data-theme="light"] .pill.p-block {
  color: #991b1b !important;
  background: #fee2e2 !important;
  border: 1px solid #dc2626 !important;
}
.node-name { font-weight: 600; font-size: 13px; color: var(--text-primary); }
.node-desc { font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-divider { height: 1px; background: var(--border-subtle); margin: 14px 14px; }

/* Secondary Rail Tools */
.rail-nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  border: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  width: 100%;
  text-align: left;
}
.rail-nav-btn:hover { color: var(--text-primary); background: var(--bg-surface-hover); }
.rail-nav-btn.active { color: var(--brand-accent); background: var(--bg-surface); border: 1px solid var(--border-default); }
.rail-nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

/* Main Canvas */
.main-canvas {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg-app);
  padding: 24px;
  gap: 20px;
  max-width: 100vw;
  box-sizing: border-box;
}

/* ─────────────────────────────────────────────────────────────
   VERDICT HERO COMPONENT (DOMINANT MERGE GATE STATE)
   ───────────────────────────────────────────────────────────── */
.verdict {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: relative;
  overflow: hidden;
}
.verdict::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 6px;
}
.v-ALLOWED::before { background: var(--signal-pass); }
.v-ALLOWED { border-color: var(--signal-pass-border); }
.v-BLOCKED::before { background: var(--signal-block); }
.v-BLOCKED { border-color: var(--signal-block-border); }
.v-CHANGES_REQUIRED::before { background: var(--signal-warn); }
.v-CHANGES_REQUIRED { border-color: var(--signal-warn-border); }

.verdict-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.verdict-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}
.verdict-icon-box {
  width: 44px;
  height: 44px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.verdict-icon-box svg { width: 24px; height: 24px; }
.v-ALLOWED .verdict-icon-box { background: var(--signal-pass-bg); color: var(--signal-pass); border: 1px solid var(--signal-pass-border); }
.v-BLOCKED .verdict-icon-box { background: var(--signal-block-bg); color: var(--signal-block); border: 1px solid var(--signal-block-border); }
.v-CHANGES_REQUIRED .verdict-icon-box { background: var(--signal-warn-bg); color: var(--signal-warn); border: 1px solid var(--signal-warn-border); }

.verdict-badge .big {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.v-ALLOWED .big { color: var(--signal-pass); }
.v-BLOCKED .big { color: var(--signal-block); }
.v-CHANGES_REQUIRED .big { color: var(--signal-warn); }

.verdict-summary {
  flex: 1;
  min-width: 260px;
}
.verdict-reason {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.verdict-meta {
  font-size: 12.5px;
  color: var(--text-secondary);
}

.verdict-action-slot {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* Gate Checklist */
.gate-checklist {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
}
.gate-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-surface-raised);
  border-radius: 8px;
  border: 1px solid var(--border-subtle);
}
.gate-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}
.gate-icon svg { width: 14px; height: 14px; }
.gate-pass .gate-icon { color: var(--signal-pass); }
.gate-fail .gate-icon { color: var(--signal-block); }
.gate-warn .gate-icon { color: var(--signal-warn); }
.gate-pending .gate-icon { color: var(--text-muted); }
.gate-label { font-size: 12px; font-weight: 700; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.04em; }
.gate-detail { font-size: 11.5px; color: var(--text-secondary); line-height: 1.4; margin-top: 2px; }

/* Telemetry Cards */
.telemetry-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  max-width: 100%;
}
.telemetry-card h3 {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 0 0 14px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Skeleton Loading State Shimmer */
.skeleton-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.skeleton-bar {
  height: 14px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--bg-surface-raised) 25%, var(--bg-surface-hover) 50%, var(--bg-surface-raised) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* Friendly Empty States */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  text-align: center;
  gap: 10px;
}
.empty-state-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--signal-pass-bg);
  color: var(--signal-pass);
  border: 1px solid var(--signal-pass-border);
  display: flex;
  align-items: center;
  justify-content: center;
}
.empty-state-icon svg { width: 20px; height: 20px; }
.empty-state-icon.is-error {
  background: var(--signal-block-bg);
  color: var(--signal-block);
  border-color: var(--signal-block-border);
}
.empty-state-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}
.state-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 6px;
  flex-wrap: wrap;
}

/* Click-to-Copy Styling */
.copyable {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
  user-select: all;
}
.copyable:hover {
  color: var(--brand-accent) !important;
}
.copyable svg {
  opacity: 0.6;
  transition: opacity 0.15s ease;
}
.copyable:hover svg {
  opacity: 1;
}

/* Complexity Visualization Bars */
.comp-bar-container {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 130px;
}
.comp-bar-track {
  height: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 99px;
  position: relative;
  overflow: visible;
}
.comp-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.3s ease;
}
.comp-bar-fill.bar-ok { background: var(--signal-pass); }
.comp-bar-fill.bar-warn { background: var(--signal-warn); }
.comp-bar-fill.bar-block { background: var(--signal-block); }
.comp-threshold-line {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 2px;
  background: var(--text-primary);
  border-radius: 1px;
  box-shadow: 0 0 4px rgba(0,0,0,0.5);
  z-index: 2;
}
.comp-bar-label {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}

/* PR Map Row Hover & Risk */
.pr-file-row {
  cursor: pointer;
  transition: background 0.15s ease;
}
.pr-file-row:hover td {
  background: var(--bg-surface-hover) !important;
}
.file-risk-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
}

/* Buttons */
button {
  font-family: inherit;
  color: var(--text-primary);
}
button.b {
  background: var(--brand-accent);
  color: var(--text-inverse);
  border: 0;
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}
button.b:hover { background: var(--brand-accent-hover); }
button.b.s {
  background: var(--bg-surface-raised);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
}
button.b.s:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
}
button.b.xs {
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  background: var(--bg-surface-raised);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
}
button.b.xs:hover {
  background: var(--bg-surface-hover);
  border-color: var(--border-strong);
}
button.b.d { background: var(--signal-block); color: var(--text-inverse); }
button.b.g { background: var(--signal-pass); color: var(--text-inverse); }
button.b:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

/* Form Controls */
input, textarea, select {
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 13px;
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--brand-accent);
  box-shadow: 0 0 0 2px var(--brand-accent-glow);
}
textarea { font-family: var(--font-mono); font-size: 12px; min-height: 110px; }
label { font-size: 11.5px; font-weight: 600; color: var(--text-muted); display: block; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 150px; }
.row > button { flex: none; }

/* Responsive Table Container (Zero horizontal page scroll on mobile) */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 8px;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
th { color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
tr:hover td { background: var(--bg-surface-raised); }

/* Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-default);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.p-block { color: var(--signal-block); border-color: var(--signal-block-border); background: var(--signal-block-bg); }
.p-warn { color: var(--signal-warn); border-color: var(--signal-warn-border); background: var(--signal-warn-bg); }
.p-ok { color: var(--signal-pass); border-color: var(--signal-pass-border); background: var(--signal-pass-bg); }
.p-ai { color: var(--signal-ai); border-color: var(--signal-ai-border); background: var(--signal-ai-bg); }

code, pre { font-family: var(--font-mono); font-size: 12px; }
pre {
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  max-width: 100%;
  max-height: 380px;
  margin: 6px 0;
  color: var(--text-secondary);
  word-break: break-all;
}

.diff .a { color: var(--signal-pass); background: var(--signal-pass-bg); }
.diff .r { color: var(--signal-block); background: var(--signal-block-bg); }
.diff .h { color: var(--brand-accent); }
.arrow { color: var(--text-muted); }
.good { color: var(--signal-pass); font-weight: 600; }
.mut { color: var(--text-muted); }
.small { font-size: 12px; }
.err { color: var(--signal-block); }
.busy { opacity: 0.65; pointer-events: none; }

/* Toast Notifications */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  box-shadow: var(--shadow-md);
  font-size: 13px;
  animation: toastIn 0.15s ease;
  max-width: 440px;
}
.toast-err { border-color: var(--signal-block-border); }
.toast-close-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
  display: flex;
  align-items: center;
  border-radius: 4px;
}
.toast-close-btn:hover { color: var(--text-primary); }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ─────────────────────────────────────────────────────────────
   CRYPTOGRAPHIC AUDIT CHAIN TIMELINE
   ───────────────────────────────────────────────────────────── */
.audit-timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  padding-left: 12px;
  margin-top: 10px;
}
.audit-node {
  display: flex;
  gap: 18px;
  position: relative;
  padding-bottom: 24px;
}
.audit-node:last-child {
  padding-bottom: 8px;
}
.chain-line-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  width: 24px;
  position: relative;
}
.chain-node-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg-surface-raised);
  border: 2px solid var(--brand-accent);
  z-index: 2;
  transition: all 0.25s ease;
}
.audit-node.tampered .chain-node-dot {
  border-color: var(--signal-block);
  background: var(--signal-block);
  box-shadow: 0 0 8px var(--signal-block);
}
.audit-node.sweep-active .chain-node-dot {
  border-color: var(--signal-pass);
  background: var(--signal-pass);
  box-shadow: 0 0 10px var(--signal-pass);
}
.chain-connector {
  position: absolute;
  top: 14px;
  bottom: -4px;
  width: 2px;
  background: var(--border-default);
  z-index: 1;
}
.audit-node:last-child .chain-connector {
  display: none;
}
.audit-node.tampered .chain-connector,
.audit-node.downstream-broken .chain-connector {
  background: var(--signal-block);
  border-left: 2px dashed var(--signal-block);
  width: 0;
}
.audit-node-body {
  flex: 1;
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  padding: 12px 16px;
  transition: all 0.2s ease;
}
.audit-node.tampered .audit-node-body {
  border-color: var(--signal-block);
  background: var(--signal-block-bg);
}
.audit-node.downstream-broken .audit-node-body {
  border-color: var(--signal-block-border);
  opacity: 0.9;
}
.audit-node-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 6px;
}
.audit-seq {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--brand-accent);
}
.audit-hash-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-input);
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

/* ─────────────────────────────────────────────────────────────
   FILE DIFF INSPECTION MODAL / OVERLAY
   ───────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: fadeIn 0.15s ease;
}
.modal-window {
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 1100px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg-surface-raised);
}
.modal-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  padding: 0;
  background: var(--bg-app);
}

/* Diff Table & Line Numbers */
.diff-viewer {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
}
.diff-viewer tr td {
  padding: 2px 6px;
  border: 0;
  vertical-align: top;
}
.diff-ln {
  width: 44px;
  text-align: right;
  color: var(--text-muted);
  user-select: none;
  font-size: 11px;
  padding-right: 12px !important;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle) !important;
}
.diff-code {
  white-space: pre-wrap;
  word-break: break-all;
  padding-left: 12px !important;
}
.diff-line-add { background: var(--signal-pass-bg); }
.diff-line-add .diff-ln { color: var(--signal-pass); background: rgba(52, 211, 153, 0.05); }
.diff-line-del { background: var(--signal-block-bg); }
.diff-line-del .diff-ln { color: var(--signal-block); background: rgba(248, 113, 113, 0.05); }
.diff-line-hunk { background: var(--bg-surface-raised); color: var(--brand-accent); font-weight: 600; }

/* Inline Diff Finding Annotation Callout */
.diff-annot-box {
  margin: 6px 12px;
  padding: 10px 14px;
  border-radius: 6px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-family: var(--font-sans);
  font-size: 12px;
}
.diff-annot-block {
  background: var(--signal-block-bg);
  border: 1px solid var(--signal-block-border);
  color: var(--text-primary);
}
.diff-annot-warn {
  background: var(--signal-warn-bg);
  border: 1px solid var(--signal-warn-border);
  color: var(--text-primary);
}
.annot-tag {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.diff-annot-block .annot-tag { background: var(--signal-block); color: var(--text-inverse); }
.diff-annot-warn .annot-tag { background: var(--signal-warn); color: var(--text-inverse); }

/* Code Syntax Tokens */
.syn-kw { color: var(--syn-keyword); font-weight: 600; }
.syn-str { color: var(--syn-string); }
.syn-comm { color: var(--syn-comment); font-style: italic; }
.syn-num { color: var(--syn-number); }

/* ─────────────────────────────────────────────────────────────
   COMMAND PALETTE & TOUR HUD
   ───────────────────────────────────────────────────────────── */
.cmd-box {
  width: 100%;
  max-width: 580px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.cmd-input-wrap {
  display: flex;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-default);
  gap: 12px;
}
.cmd-input-wrap svg { width: 18px; height: 18px; color: var(--brand-accent); }
.cmd-input {
  border: 0;
  background: transparent;
  color: var(--text-primary);
  font-size: 15px;
  padding: 0;
}
.cmd-input:focus { outline: none; box-shadow: none; }
.cmd-list {
  max-height: 340px;
  overflow-y: auto;
  padding: 8px;
}
.cmd-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.1s ease;
  color: var(--text-secondary);
}
.cmd-item:hover, .cmd-item.selected {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}
.cmd-item kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--bg-input);
  border: 1px solid var(--border-default);
  border-radius: 4px;
  padding: 2px 6px;
}

/* Guided Tour HUD */
.tour-hud {
  position: fixed;
  bottom: 24px;
  left: 310px;
  right: 24px;
  background: var(--bg-surface);
  border: 2px solid var(--brand-accent);
  border-radius: 10px;
  padding: 14px 20px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  z-index: 80;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Responsive adjustments (Down to 360px without horizontal scroll) */
@media (max-width: 900px) {
  .topbar { padding: 0 12px; }
  .meta-chip { display: none; }
  .mobile-menu-btn { display: flex; }
  .telemetry-rail {
    position: fixed;
    top: 52px;
    bottom: 0;
    left: 0;
    width: 290px;
    z-index: 50;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }
  .telemetry-rail.open {
    transform: translateX(0);
  }
  .main-canvas { padding: 14px; }
  .verdict-banner { flex-direction: column; align-items: flex-start; }
  .tour-hud { left: 16px; right: 16px; bottom: 16px; }
}
@media (max-width: 480px) {
  .scen-label { display: none; }
  .scen-btn { padding: 4px 8px; font-size: 10.5px; }
  .gate-checklist { grid-template-columns: 1fr; }
  .action-chip-btn span { display: none; }
  .verdict-badge .big { font-size: 22px; }
}

/* ─────────────────────────────────────────────────────────────
   ROLE-BASED ACCESS CONTROL (RBAC) & CORPORATE IDENTITY STYLES
   ───────────────────────────────────────────────────────────── */
.user-role-menu-wrapper {
  position: relative;
  display: inline-flex;
  align-items: center;
  margin-left: 4px;
}
.user-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-surface-raised);
  border: 1px solid var(--border-default);
  border-radius: 9999px;
  padding: 4px 10px 4px 5px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.user-pill:hover {
  background: var(--bg-surface-hover);
  border-color: var(--brand-accent);
}
.user-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-accent), #818cf8);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  letter-spacing: -0.5px;
}
.user-info-brief {
  display: flex;
  align-items: center;
  gap: 6px;
}
.user-name-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  max-width: 110px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.user-role-badge {
  font-size: 9.5px;
  font-weight: 700;
  padding: 1.5px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.role-admin {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
  border: 1px solid rgba(239, 68, 68, 0.35);
}
.role-security {
  background: rgba(168, 85, 247, 0.16);
  color: #c084fc;
  border: 1px solid rgba(168, 85, 247, 0.35);
}
.role-tester {
  background: rgba(234, 179, 8, 0.16);
  color: #facc15;
  border: 1px solid rgba(234, 179, 8, 0.35);
}
.role-developer {
  background: rgba(56, 189, 248, 0.16);
  color: #38bdf8;
  border: 1px solid rgba(56, 189, 248, 0.35);
}
.user-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 330px;
  max-width: calc(100vw - 24px);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.1);
  z-index: 99999;
  padding: 8px 0;
  display: none;
}
.user-dropdown-menu.open {
  display: block;
}
.dropdown-header-block {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-subtle);
}
.dropdown-user-name {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--text-primary);
}
.dropdown-user-email {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 2px;
}
.dropdown-section-title {
  padding: 8px 16px 4px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
}
.persona-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  cursor: pointer;
  transition: background 0.12s ease;
  font-size: 12.5px;
}
.persona-item:hover {
  background: var(--bg-surface-hover);
}
.persona-item.active {
  background: var(--bg-surface-raised);
  border-left: 3px solid var(--brand-accent);
}
.persona-desc {
  font-size: 11px;
  color: var(--text-muted);
}
.dropdown-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 6px 0;
}
.dropdown-action-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 16px;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  text-align: left;
}
.dropdown-action-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}

.role-perspective-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 16px;
  font-size: 12.5px;
  font-weight: 500;
  border: 1px solid transparent;
}
.role-perspective-banner.admin-banner {
  background: rgba(239, 68, 68, 0.08);
  border-color: rgba(239, 68, 68, 0.28);
}
.role-perspective-banner.sec-banner {
  background: rgba(168, 85, 247, 0.08);
  border-color: rgba(168, 85, 247, 0.28);
}
.role-perspective-banner.tester-banner {
  background: rgba(234, 179, 8, 0.08);
  border-color: rgba(234, 179, 8, 0.28);
}
.role-perspective-banner.dev-banner {
  background: rgba(56, 189, 248, 0.08);
  border-color: rgba(56, 189, 248, 0.28);
}

.rbac-matrix-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 14px;
  font-size: 12px;
}
.rbac-matrix-table th, .rbac-matrix-table td {
  padding: 8px 12px;

<script>
/* ─────────────────────────────────────────────────────────────
   GLOBAL STATE & INLINE SVG ICON DICTIONARY

const ICONS = {
  check: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',

  block: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>',
  close: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>',
  linkBroken: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>',
  copy: '<svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
  enter: '<svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 4v7a4 4 0 0 1-4 4H4"></path></svg>',
  arrowLeft: '<svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>',
  arrowRight: '<svg class="icon-inline-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>',
  dot: '<svg class="icon-inline-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle></svg>',
  robot: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>',
  user: '<svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'
};

const S = {
  tab: "review",
  token: new URLSearchParams(location.search).get("t") || "",
  sessionToken: localStorage.getItem("repobrain_session_token") || "",
  currentUser: null,
  companyName: "Acme Corp",
  state: null,
  rev: null,
  prop: null,
  audit: null,
  shield: null,
  expl: null,
  tamper: null,
  busy: false,
  error: null,
  tourActive: false,
  tourIndex: 0,
  presenterMode: false
};

const $ = s => document.querySelector(s);
function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* Non-blocking toast notifications replace browser alerts */
function toast(msg, isErr = false) {
  const c = $("#toast-container");
  if (!c) return;
  const el = document.createElement("div");
  el.className = `toast ${isErr ? "toast-err" : ""}`;
  el.innerHTML = `
    <span style="color:${isErr ? 'var(--signal-block)' : 'var(--signal-pass)'}">${isErr ? ICONS.block : ICONS.check}</span>
    <div style="flex:1">${esc(msg)}</div>
    <button class="toast-close-btn" onclick="this.parentElement.remove()" title="Dismiss">${ICONS.close}</button>
  `;
  c.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
}

/* Copy to clipboard with visual feedback & toast */
async function copyText(text, label = "Item") {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast(`Copied ${label} to clipboard`);
  } catch (err) {
    toast(`Failed to copy: ${err.message}`, true);
  }
}

async function api(path, body) {
  const opts = { headers: {} };
  if (S.token) opts.headers["X-RepoBrain-Token"] = S.token;
  if (S.sessionToken) opts.headers["X-RepoBrain-Session"] = S.sessionToken;
  opts.headers["X-RepoBrain"] = "1";
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.statusText;
    try { const j = await r.json(); msg = j.error || msg; } catch(_) {}
    if (r.status === 403 && (msg.includes("Permission Denied") || msg.includes("Only Admin") || msg.includes("cannot approve"))) {
      openPermissionDeniedModal(msg);
    }
    throw new Error(msg);
  }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("application/json") ? r.json() : r.text();
}

async function guard(fn) {
  S.busy = true;
  S.error = null;
  render();
  try {
    await fn();
    S.error = null;
  } catch (e) {
    S.error = e.message || "Unexpected telemetry error";
    toast(S.error, true);
  } finally {
    S.busy = false;
    render();
  }
}

function clearError() {
  S.error = null;
  render();

function initTheme() {
  const saved = localStorage.getItem("repobrain-theme");
  const theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
  updateThemeIcon(theme);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nxt);
  localStorage.setItem("repobrain-theme", nxt);
  updateThemeIcon(nxt);
  toast(`Switched to ${nxt} telemetry mode`);
}

function updateThemeIcon(t) {

   ───────────────────────────────────────────────────────────── */
const TABS = [
  ["review", "PR review"],
  ["optimizer", "Optimizer"],
  ["shield", "Shield"],
  ["explainer", "Failure explainer"],
  ["audit", "Audit & report"],
  ["policy", "Policy"],
  ["auth", "Identity & auth"]
];

function nav() {
  document.querySelectorAll(".rail-nav-btn").forEach(btn => btn.classList.remove("active"));
  const btnMap = {
    review: $("#btnTabReview"),
    optimizer: $("#btnTabOptimizer"),
    shield: $("#btnTabShield"),
    explainer: $("#btnTabExplainer"),
    audit: $("#btnTabAudit"),
    policy: $("#btnTabPolicy"),
    auth: $("#btnTabAuth")
  };
  if (btnMap[S.tab]) btnMap[S.tab].classList.add("active");

  // Hidden nav for backwards compatibility
  const hnav = $("#nav");
  if (hnav) {
    hnav.innerHTML = TABS.map(([k, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join("");
  }
}

function go(tab) {
  closeUserDropdown();
  S.tab = tab;
  nav();
  if (tab === "audit") {
    audit().then(render);
  } else {
    render();
  }
  if (window.innerWidth <= 900) {
    $("#telemetryRail").classList.remove("open");
  }
}

async function loadState() {
  S.state = await api("/api/state");
  if (S.state && S.state.auth) {
    S.currentUser = S.state.auth.current_user;
    S.companyName = S.state.auth.company || "Acme Corp";
  }
  renderUserRoleBar();
  const r = (S.state && S.state.repo) || {};
  const headSha = String(r.head || "");
  const shortSha = headSha.slice(0, 8);

  $("#meta").innerHTML = `
    <span>${esc(r.branch || "")}</span>
    <span style="color:var(--border-strong)">@</span>

function validateCorporateEmailLive(val, feedbackId) {
  const el = $(feedbackId);
  if (!el) return;
  if (!val || !val.includes("@")) {
    el.innerHTML = "";
    return;
  }
  const domain = val.split("@")[1].toLowerCase().trim();
  if (BLOCKED_DOMAINS.includes(domain)) {
    el.innerHTML = `<span style="color:var(--signal-block)">[BLOCKED] Personal webmail (@${esc(domain)}) not permitted. Please use corporate company email.</span>`;
  } else if (domain.includes(".")) {
    el.innerHTML = `<span style="color:var(--signal-pass)">${ICONS.check} Valid corporate domain (@${esc(domain)})</span>`;
  } else {
    el.innerHTML = "";
  }
}

async function logoutUser() {
  closeUserDropdown();
  try {
    await api("/api/auth/logout", { token: S.sessionToken });
  } catch(_) {}
  S.sessionToken = "";
  localStorage.removeItem("repobrain_session_token");
  S.currentUser = null;
  await loadState();
  toast("Signed out of corporate session");
  render();
}

async function audit() {
  try {
    S.audit = await api("/api/audit");
    const a = S.audit;
    const chainEl = $("#chainStatus");
    if (chainEl && a && a.chain) {
      const isSigned = !!(a.chain.hmac_signed || a.chain.signed);
      chainEl.className = a.chain.ok ? (isSigned ? "pill p-ok" : "pill p-warn") : "pill p-block";
      chainEl.innerHTML = a.chain.ok
        ? `${ICONS.check} chain verified · ${isSigned ? 'HMAC-signed' : 'hash-only'} (${a.chain.count})`
        : `${ICONS.block} chain BROKEN`;
    }
  } catch (_) {}
}

function updatePipelineTelemetry() {
  if (!S.rev) return;
  const r = S.rev, c = r.counts;

  // 1. Shield
  const sIcon = $("#pipeShieldIcon");
  const sBadge = $("#pipeShieldBadge");
  const sDesc = $("#pipeShieldDesc");
  if (c.blocks > 0) {
    sIcon.className = "node-status-icon status-block";
    sBadge.className = "pill p-block";
    sBadge.innerHTML = `${ICONS.block} ${c.blocks} block`;
    sDesc.textContent = `${c.blocks} blocking violation(s)`;
  } else if (c.warnings > 0) {
    sIcon.className = "node-status-icon status-warn";
    sBadge.className = "pill p-warn";
    sBadge.innerHTML = `${ICONS.warn} ${c.warnings} warn`;
    sDesc.textContent = "Warnings detected";
  } else {
    sIcon.className = "node-status-icon status-pass";
    sBadge.className = "pill p-ok";
    sBadge.innerHTML = `${ICONS.check} pass`;
    sDesc.textContent = "Policy & secrets clean";
  }

  // 2. Complexity Gate
  const gIcon = $("#pipeGateIcon");
  const gBadge = $("#pipeGateBadge");
  const gDesc = $("#pipeGateDesc");
  if (c.gate > 0) {
    gIcon.className = "node-status-icon status-warn";
    gBadge.className = "pill p-warn";
    gBadge.innerHTML = `${ICONS.warn} ${c.gate} fail`;
    gDesc.textContent = `${c.gate} function(s) over threshold`;
  } else {
    gIcon.className = "node-status-icon status-pass";
    gBadge.className = "pill p-ok";
    gBadge.innerHTML = `${ICONS.check} pass`;
    gDesc.textContent = "All touched functions within limit";
  }

  // 3. Optimizer
  const oIcon = $("#pipeOptIcon");
  const oBadge = $("#pipeOptBadge");
  const oDesc = $("#pipeOptDesc");
  if (S.prop && S.prop.status === "verified") {
    oIcon.className = "node-status-icon status-pass";
    oBadge.className = "pill p-ok";
    oBadge.innerHTML = `${ICONS.check} verified`;
    oDesc.textContent = "Tests verified on copy";
  } else if (S.prop && S.prop.status.includes("partial")) {
    oIcon.className = "node-status-icon status-warn";
    oBadge.className = "pill p-warn";
    oBadge.innerHTML = `${ICONS.warn} partial`;
    oDesc.textContent = "Uncovered functions flagged";
  } else {
    oIcon.className = "node-status-icon status-pass";
    oBadge.className = "pill p-ready";
    oBadge.textContent = "ready";
    oDesc.textContent = "AST rewrite & tests on scratch copy";
  }

  // 4. Human Approval
  const aIcon = $("#pipeApproveIcon");
  const aBadge = $("#pipeApproveBadge");
  const aDesc = $("#pipeApproveDesc");
  if (S.prop && S.prop.applied) {
    aIcon.className = "node-status-icon status-pass";
    aBadge.className = "pill p-ok";
    aBadge.innerHTML = `${ICONS.check} approved`;
    aDesc.textContent = `Applied as commit ${S.prop.applied.commit ? String(S.prop.applied.commit).slice(0, 7) : "commit"}`;
  } else {
    aIcon.className = "node-status-icon status-warn";
    aBadge.className = "pill p-warn";
    aBadge.textContent = "required";
    aDesc.textContent = "Named approver trailer";
  }

  // 5. Merge Gate Verdict
  const mIcon = $("#pipeMergeIcon");
  const mBadge = $("#pipeMergeBadge");
  const mDesc = $("#pipeMergeDesc");
  if (r.decision === "ALLOWED") {
    mIcon.className = "node-status-icon status-pass";
    mBadge.className = "pill p-ok";
    mBadge.innerHTML = `${ICONS.check} ALLOWED`;
    mDesc.textContent = "All gates passed. Ready to merge";
  } else if (r.decision === "BLOCKED") {
    mIcon.className = "node-status-icon status-block";
    mBadge.className = "pill p-block";
    mBadge.innerHTML = `${ICONS.block} BLOCKED`;
    mDesc.textContent = "Blocked by policy. Not waivable";
  } else {
    mIcon.className = "node-status-icon status-warn";
    mBadge.className = "pill p-warn";
    mBadge.innerHTML = `${ICONS.warn} CHANGES REQUIRED`;
    mDesc.textContent = "Requires optimizer or human waiver";
  }

  // Update aria-live announcer for screen readers
  const announcer = $("#verdictAnnouncer");
  if (announcer) {
    const announcement = `Governance verdict updated: ${r.decision.replace("_", " ")}. ${r.reason}`;
    if (announcer.textContent !== announcement) announcer.textContent = announcement;
  }
}

/* ─────────────────────────────────────────────────────────────
   COMPLEXITY BARS VISUALIZATION
   ───────────────────────────────────────────────────────────── */
function renderCompBar(val, threshold, maxScale = 30) {
  const pct = Math.min(100, Math.max(0, (val / maxScale) * 100));
  const threshPct = Math.min(100, Math.max(0, (threshold / maxScale) * 100));
  const isOver = val > threshold;
  const barClass = isOver ? "bar-warn" : "bar-ok";
  return `
  <div class="comp-bar-container">
    <div class="comp-bar-track" title="Measured: ${val} | Policy Threshold: ${threshold}">
      <div class="comp-bar-fill ${barClass}" style="width:${pct}%"></div>
      <div class="comp-threshold-line" style="left:${threshPct}%"></div>
    </div>
    <div class="comp-bar-label">
      <span style="${isOver ? 'color:var(--signal-warn);font-weight:700' : ''}">${val}</span>
      <span class="mut">lim ${threshold}</span>
    </div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────
   CODE SYNTAX HIGHLIGHTER (Python, YAML, Markdown, Diff)
   Single-pass tokenizer avoids matching HTML attributes injected by earlier passes.
   ───────────────────────────────────────────────────────────── */
const KW = new Set([
  "def","class","import","from","as","return","if","elif","else","try","except",
  "finally","raise","with","for","while","pass","break","continue","in","is","and","or","not",
  "yield","async","await","lambda","True","False","None"
]);

function highlightCode(raw) {
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+)\b|\b([A-Za-z_]\w*)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(raw))) {
    out += esc(raw.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="syn-comm">${t}</span>`;
    else if (m[2]) out += `<span class="syn-str">${t}</span>`;
    else if (m[3]) out += `<span class="syn-num">${t}</span>`;
    else if (KW.has(m[4])) out += `<span class="syn-kw">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(raw.slice(last));
}

/* ─────────────────────────────────────────────────────────────
   FILE DIFF INSPECTION MODAL WITH INLINE ANNOTATIONS

async function openDiff(path) {
  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="pill">DIFF INSPECTOR</span>
            <code style="font-size:14px;font-weight:700">${esc(path)}</code>
          </div>
          <button class="b s" onclick="closeDiffModal()">${ICONS.close} Close (Esc)</button>
        </div>
        <div class="modal-body" style="padding:24px">
          <div class="skeleton-bar" style="width: 50%; height: 16px; margin-bottom: 12px;"></div>
          <div class="skeleton-bar" style="width: 90%; height: 14px; margin-bottom: 8px;"></div>
          <div class="skeleton-bar" style="width: 70%; height: 14px;"></div>
        </div>
      </div>
    </div>
  `;

  try {
    const data = await api(`/api/diff?path=${encodeURIComponent(path)}`);
    renderDiffModalContent(data);
  } catch (e) {
    container.innerHTML = `
      <div class="modal-overlay" onclick="closeDiffModal()">
        <div class="modal-window">
          <div class="modal-header">
            <h3>Diff Inspection Error</h3>
            <button class="b s" onclick="closeDiffModal()">${ICONS.close}</button>
          </div>
          <div class="modal-body" style="padding:24px">
            <div class="err">${esc(e.message)}</div>
          </div>
        </div>
      </div>
    `;
  }
}

function renderDiffModalContent(data) {
  const findingsByLine = {};
  (data.findings || []).forEach(f => {
    const ln = f.line || 0;
    if (!findingsByLine[ln]) findingsByLine[ln] = [];
    findingsByLine[ln].push(f);
  });

  const lines = (data.diff || "").split("\n");
  let oldLn = 0, newLn = 0;
  let rowsHtml = "";

  if (findingsByLine[0]) {
    findingsByLine[0].forEach(f => {
      rowsHtml += `
        <tr>
          <td colspan="3" style="padding:0">
            <div class="diff-annot-box ${f.severity === 'block' ? 'diff-annot-block' : 'diff-annot-warn'}">
              <span class="annot-tag">${f.severity === 'block' ? ICONS.block : ICONS.warn} ${esc(f.severity)}</span>
              <div>
                <b>Shield Rule [${esc(f.rule)}]</b>: ${esc(f.message)}
                ${f.evidence ? `<div><code style="background:var(--bg-input);padding:2px 6px;border-radius:4px">${esc(f.evidence)}</code></div>` : ""}
              </div>
            </div>
          </td>
        </tr>
      `;
    });
  }

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("@@")) {
      const m = l.match(/@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
      if (m) {
        oldLn = parseInt(m[1], 10);
        newLn = parseInt(m[2], 10);
      }
      rowsHtml += `
        <tr class="diff-line-hunk">
          <td class="diff-ln">…</td>
          <td class="diff-ln">…</td>
          <td class="diff-code">${esc(l)}</td>
        </tr>
      `;
      continue;
    }

    let lineClass = "";
    let curOld = "", curNew = "";

    if (l.startsWith("+") && !l.startsWith("+++")) {
      lineClass = "diff-line-add";
      curNew = newLn++;
    } else if (l.startsWith("-") && !l.startsWith("---")) {
      lineClass = "diff-line-del";
      curOld = oldLn++;
    } else if (l.startsWith(" ")) {
      curOld = oldLn++;
      curNew = newLn++;
    } else {
      rowsHtml += `
        <tr>
          <td class="diff-ln"></td>
          <td class="diff-ln"></td>
          <td class="diff-code mut">${esc(l)}</td>
        </tr>
      `;
      continue;
    }

    rowsHtml += `
      <tr class="${lineClass}">
        <td class="diff-ln">${curOld}</td>
        <td class="diff-ln">${curNew}</td>
        <td class="diff-code">${highlightCode(l)}</td>
      </tr>
    `;

    const matchLine = curNew || curOld;
    if (matchLine && findingsByLine[matchLine]) {
      findingsByLine[matchLine].forEach(f => {
        rowsHtml += `
          <tr>
            <td colspan="3" style="padding:0">
              <div class="diff-annot-box ${f.severity === 'block' ? 'diff-annot-block' : 'diff-annot-warn'}">
                <span class="annot-tag">${f.severity === 'block' ? ICONS.block : ICONS.warn} ${esc(f.severity)}</span>
                <div>
                  <b>Shield Finding [${esc(f.rule)}]</b>: ${esc(f.message)}
                  ${f.evidence ? `<div><code style="background:var(--bg-input);padding:2px 6px;border-radius:4px">${esc(f.evidence)}</code></div>` : ""}
                </div>
              </div>
            </td>
          </tr>
        `;
      });
    }
  }

  const container = $("#modalContainer");
  container.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeDiffModal()">
      <div class="modal-window">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="pill ${data.status === 'A' ? 'p-ok' : data.status === 'D' ? 'p-block' : 'p-warn'}">${esc(data.status)}</span>
            <code style="font-size:14px;font-weight:700">${esc(data.path)}</code>
            <span class="mut small">${(data.findings || []).length} Shield annotations</span>
          </div>
          <button class="b s" onclick="closeDiffModal()">${ICONS.close} Close (Esc)</button>
        </div>
        <div class="modal-body">
          <table class="diff-viewer">
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function closeDiffModal() {
  $("#modalContainer").innerHTML = "";
}

/* ─────────────────────────────────────────────────────────────
   VIEW: REVIEW (VERDICT HERO + GATE CHECKLIST + PR MAP)
   ───────────────────────────────────────────────────────────── */
function vReview() {
  const r = S.rev;
  if (!r) {
    return `<div class="telemetry-card"><button class="b" onclick="runReview()">Run review on current branch</button></div>`;
  }

  const c = r.counts;
  const isAllowed = r.decision === "ALLOWED";
  const isBlocked = r.decision === "BLOCKED";
  const isGateFail = r.decision === "CHANGES_REQUIRED";

  const shieldOk = c.blocks === 0;
  const gateOk = c.gate === 0;
  const testsOk = isAllowed || (S.prop && S.prop.tests && S.prop.tests.ok);
  const humanOk = isAllowed || (S.prop && S.prop.applied);

  let actionBtn = "";
  if (isBlocked) {
    actionBtn = `<button class="b d" disabled title="Blocked changes cannot be merged">${ICONS.block} Not Waivable (Fix &amp; Push)</button>`;
  } else if (isGateFail) {
    actionBtn = `<button class="b" onclick="go('optimizer');runOpt()">Run optimizer ${ICONS.arrowRight}</button>`;
  } else {
    actionBtn = `<button class="b g" onclick="runReview()">${ICONS.check} Ready to Merge</button>`;
  }

  const fx = r.files.map(f => {
    const aiTag = f.ai
      ? `<span class="pill p-ai">${ICONS.robot} AI-Authored</span><div class="mut small" style="margin-top:2px">${esc(f.actors.join(", "))}</div>`
      : `<span class="pill">${ICONS.user} Human</span><div class="mut small" style="margin-top:2px">${esc(f.actors.join(", "))}</div>`;
    const statusChip = f.status === "A" ? `<span class="pill p-ok">ADD</span>` : f.status === "D" ? `<span class="pill p-block">DEL</span>` : `<span class="pill">MOD</span>`;

    const hasBlocks = f.findings.some(x => x.severity === "block");
    const hasWarns = f.findings.some(x => x.severity === "warn");
    const riskChip = hasBlocks
      ? `<span class="file-risk-chip err">${ICONS.block} High Risk (${f.findings.length})</span>`
      : hasWarns
      ? `<span class="file-risk-chip" style="color:var(--signal-warn)">${ICONS.warn} Warn (${f.findings.length})</span>`
      : `<span class="file-risk-chip good">${ICONS.check} Clean</span>`;

    const findingsList = f.findings.map(x => sev(x.severity) + " " + esc(x.rule) + (x.line ? ":" + x.line : "")).join("<br>") || `<span class="good small file-risk-chip">${ICONS.check} Clean</span>`;

    return `<tr class="pr-file-row" onclick="openDiff('${esc(f.path)}')" title="Click to view file diff with inline annotations">
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <code>${esc(f.path)}</code>
          <span class="mut small" style="font-size:11px">inspect diff ${ICONS.arrowRight}</span>
        </div>
      </td>
      <td>${statusChip}</td>
      <td>${aiTag}</td>
      <td>${riskChip}</td>
      <td>${findingsList}</td>
    </tr>`;
  }).join("");

  const det = r.findings.map(f => {
    const loc = `${f.file}${f.line ? ":" + f.line : ""}`;
    return `<tr>
      <td>${sev(f.severity)}</td>
      <td>
        <span class="copyable" onclick="copyText('${esc(loc)}', 'File Location')" title="Click to copy location">
          <code>${esc(loc)}</code> ${ICONS.copy}
        </span>
      </td>
      <td><b>${esc(f.rule)}</b></td>
      <td>${esc(f.message)}${f.evidence ? `<div><code style="color:var(--signal-warn)">${esc(f.evidence)}</code></div>` : ""}</td>
    </tr>`;
  }).join("");

  const gate = r.gate.map(g => `<tr>
    <td><code>${esc(g.file)}::${esc(g.name)}</code></td>
    <td>${renderCompBar(g.cc, 10, 25)}</td>
    <td>${renderCompBar(g.cog, 15, 30)}</td>
    <td>${renderCompBar(g.depth, 3, 8)}</td>
    <td><span class="mut small">${esc(g.why.join("; "))}</span></td>
  </tr>`).join("");

  return `
  <!-- Verdict Hero -->
  <div class="verdict v-${esc(r.decision)}">
    <div class="verdict-banner">
      <div class="verdict-badge">
        <div class="verdict-icon-box">
          ${isAllowed
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>'
            : isBlocked
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'}
        </div>
        <div>
          <div class="big">${esc(r.decision.replace("_", " "))}</div>
          <div class="mut small">Policy Source: <code>${esc(r.policy_source)}</code></div>
        </div>
      </div>
      <div class="verdict-summary">
        <div class="verdict-reason">${esc(r.reason)}</div>
        <div class="verdict-meta">${c.files} changed files (${c.ai_files} AI-authored) · ${c.blocks} blocking · ${c.warnings} warnings · ${c.gate} complexity violations</div>
      </div>
      <div class="verdict-action-slot">
        ${actionBtn}
        <button class="b s" onclick="runReview()" title="Re-evaluate change against base">Re-run</button>
      </div>
    </div>

    <!-- 4-Gate Telemetry Checklist -->
    <div class="gate-checklist">
      <div class="gate-item ${shieldOk ? 'gate-pass' : 'gate-fail'}">
        <div class="gate-icon">
          ${shieldOk ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'}
        </div>
        <div class="gate-info">
          <div class="gate-label">1. Shield &amp; Secrets</div>
          <div class="gate-detail">${shieldOk ? 'Protected paths &amp; secrets clean' : `${c.blocks} blocking violation(s) detected`}</div>
        </div>
      </div>

      <div class="gate-item ${gateOk ? 'gate-pass' : 'gate-warn'}">
        <div class="gate-icon">
          ${gateOk ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'}
        </div>
        <div class="gate-info">
          <div class="gate-label">2. Complexity Gate</div>
          <div class="gate-detail">${gateOk ? 'All functions within threshold' : `${c.gate} function(s) exceed limits`}</div>
        </div>
      </div>

      <div class="gate-item ${testsOk ? 'gate-pass' : 'gate-pending'}">
        <div class="gate-icon">
          ${testsOk ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'}
        </div>
        <div class="gate-info">
          <div class="gate-label">3. Safety Net Tests</div>
          <div class="gate-detail">${testsOk ? 'Verified on scratch copy with resource limits' : 'Pending optimizer evaluation'}</div>
        </div>
      </div>

      <div class="gate-item ${humanOk ? 'gate-pass' : 'gate-pending'}">
        <div class="gate-icon">
          ${humanOk ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'}
        </div>
        <div class="gate-info">
          <div class="gate-label">4. Human Approval</div>
          <div class="gate-detail">${humanOk ? 'Approved &amp; signed off' : 'Named human approval required'}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PR Map (Changed Files) -->
  <div class="telemetry-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">
        <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
        PR Changed Files &amp; Authorship Map
      </h3>
      <span class="mut small">Click any file to inspect unified diff &amp; inline annotations</span>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>File</th><th>Change</th><th>Authorship</th><th>Risk Status</th><th>Findings</th></tr>
        </thead>
        <tbody>${fx}</tbody>
      </table>
    </div>
  </div>

  <!-- Detailed Policy Findings -->
  ${det ? `
  <div class="telemetry-card">
    <h3>
      <svg style="width:14px;height:14px;color:var(--signal-block)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      Shield Policy Findings &amp; Evidence
    </h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Severity</th><th>File Location</th><th>Rule</th><th>Detail</th></tr>
        </thead>
        <tbody>${det}</tbody>
      </table>
    </div>
  </div>` : `
  <div class="telemetry-card">
    <div class="empty-state">
      <div class="empty-state-icon">${ICONS.check}</div>
      <div class="empty-state-title">All Policies &amp; Secrets Clean</div>
      <div class="mut small">Zero policy, secret, or injection violations detected in this change set.</div>
    </div>
  </div>`}

  <!-- Complexity Violations & Human Waiver -->
  ${gate ? `
  <div class="telemetry-card">
    <h3>
      <svg style="width:14px;height:14px;color:var(--signal-warn)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      Complexity Gate (Functions Touched By This Change)
    </h3>
    <div class="table-responsive">
      <table>
        <thead>
          <tr><th>Function</th><th>Cyclomatic (CC)</th><th>Cognitive</th><th>Max Depth</th><th>Why Flagged</th></tr>
        </thead>
        <tbody>${gate}</tbody>
      </table>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="b s" onclick="go('optimizer');runOpt()">Optimize touched functions</button>
    </div>
    <div class="row" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border-subtle)">
      <div>
        <label>Or waive complexity gate (human sign-off, reason logged to audit chain)</label>
        <input id="wreason" placeholder="Explain why technical debt is acceptable for this commit…">
